<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SE 101 Study Site: Quiz 2 preparation</title>
<meta name="description" content="Interactive study site for SE 101 (Fall 2026), built from the course slides and practice sets.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --ink:#1a2233; --muted:#566074; --line:#d9deea; --soft:#eef1f8;
  --brand:#3248c8; --brand-d:#25369c; --brand-bg:#eaeefc;
  --good:#1f7a36; --good-bg:#e5f4e9; --warn:#8f4a05; --warn-bg:#fff3dc; --bad:#b42323; --bad-bg:#fdeaea;
  --info-bg:#eef3ff; --code-bg:#0f172a; --code-ink:#e2e8f0;
  --radius:10px; --shadow:0 1px 2px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.6;color:var(--ink);background:var(--bg)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.85rem} h2{font-size:1.4rem} h3{font-size:1.14rem} h4{font-size:1rem}
p{margin:0 0 .85em} ul,ol{margin:0 0 .85em;padding-left:1.35em} li{margin:.2em 0}
a{color:var(--brand)} a:hover{color:var(--brand-d)}
code,kbd,pre{font-family:var(--mono)} code{background:var(--soft);padding:.05em .35em;border-radius:5px;font-size:.9em}
kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.02em .4em;font-size:.82em}
:focus-visible{outline:3px solid #f59f00;outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;cursor:pointer}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:.5em 1em;border-radius:6px;z-index:100}
.skip:focus{left:8px}

/* layout */
#app{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:56px 1fr;min-height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
#top .brand{font-weight:700;color:var(--brand);text-decoration:none;white-space:nowrap}
#top .grow{flex:1}
#top .meter{display:flex;align-items:center;gap:8px;min-width:230px;font-size:.85rem;color:var(--muted)}
#nav{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;overflow:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
#nav h4{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 8px 6px}
#nav a{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.95rem}
#nav a:hover{background:var(--soft)} #nav a.on{background:var(--brand-bg);color:var(--brand-d);font-weight:600}
#nav a .tick{margin-left:auto;color:var(--good);font-weight:700}
#nav a.locked{color:var(--muted)}
#main{padding:26px 34px 80px;max-width:1040px;width:100%}
#main:focus{outline:none}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin:0 0 18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.88rem} .tiny{font-size:.78rem}
.center{text-align:center}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:550;transition:background .12s,border-color .12s}
.btn:hover{background:var(--soft);border-color:#b9c1d6}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff} .btn.primary:hover{background:var(--brand-d)}
a.btn,a.btn:hover{text-decoration:none}
a.btn{color:var(--ink)} a.btn.primary,a.btn.primary:hover{color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#e6b0b0} .btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:4px 10px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:#b8dfc2}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:#f0d49b}
.chip.brand{background:var(--brand-bg);color:var(--brand-d);border-color:#c5cffa}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:#efbcbc}

/* progress */
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line);flex:1}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4263eb,#5c7cfa);border-radius:99px;transition:width .35s}
.bar.good>i{background:linear-gradient(90deg,#2f9e44,#51cf66)}
.obj{display:grid;grid-template-columns:34px 1fr 210px 104px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.obj .id{font-weight:700;color:var(--brand-d)}

/* callouts */
.callout{border-left:4px solid var(--brand);background:var(--info-bg);border-radius:0 8px 8px 0;padding:10px 16px;margin:0 0 14px}
.callout.key{border-color:var(--good);background:var(--good-bg)}
.callout.warn{border-color:#d9822b;background:var(--warn-bg)}
.callout.bad{border-color:var(--bad);background:var(--bad-bg)}
.callout.note{border-color:#868e96;background:#f1f3f5}
.callout b.t{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.callout p:last-child{margin-bottom:0}

/* tables */
table.t{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--soft)}

/* code */
pre.code{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:9px;overflow:auto;font-size:.88rem;line-height:1.5;margin:0 0 12px}
pre.code code{background:none;padding:0;color:inherit;font-size:inherit;border-radius:0}
pre.code .k{color:#c4a7ff} pre.code .f{color:#7dd3fc}
pre.code .s{color:#a7f3d0} pre.code .c{color:#94a3b8;font-style:italic} pre.code .n{color:#fcd34d} pre.code .d{color:#f9a8d4} pre.code .b{color:#7dd3fc} pre.code .o{color:#cbd5e1}
pre.code .hl{background:rgba(250,204,21,.16);display:inline-block;width:100%}

.ic{display:inline-block;width:1em;height:1em;vertical-align:-.14em;line-height:1}
.ic svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill svg{fill:currentColor;stroke:none}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:2px;vertical-align:-.05em;margin-right:4px}
/* glossary links */
a.gl{color:inherit;text-decoration:underline dotted var(--brand);text-underline-offset:3px;cursor:help}
a.gl.first{color:var(--brand-d);font-weight:600;text-decoration:underline solid var(--brand)}
a.gl.first::after{content:"g";font-size:.62em;font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:super;line-height:1}

/* svg */
svg.dg{width:100%;height:auto;display:block;max-width:100%}
svg.dg text{font-family:var(--font);fill:var(--ink);font-size:14px}
svg.dg .box{fill:#fff;stroke:#7d8bb8;stroke-width:1.5}
svg.dg .box.a{fill:var(--brand-bg);stroke:var(--brand)}
svg.dg .box.g{fill:var(--good-bg);stroke:var(--good)}
svg.dg .box.w{fill:var(--warn-bg);stroke:#d9822b}
svg.dg .box.r{fill:var(--bad-bg);stroke:var(--bad)}
svg.dg .ln{stroke:#51607f;stroke-width:1.8;fill:none}
svg.dg .ln.dash{stroke-dasharray:6 4;stroke:#c2561a}
svg.dg .lbl{fill:var(--muted);font-size:12.5px}
svg.dg .b{font-weight:650}
svg.dg g.hot{cursor:pointer} svg.dg g.hot:hover .box,svg.dg g.hot:focus .box{stroke-width:3}

/* forms */
input[type=text],input[type=number],textarea,select{font:inherit;border:1px solid #b7bfd3;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--brand)}
label.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:0 0 8px;cursor:pointer;background:#fff}
label.opt:hover{border-color:var(--brand)}
label.opt input{margin-top:.38em}
label.opt.sel{border-color:var(--brand);background:var(--brand-bg)}
label.opt.ok{border-color:var(--good);background:var(--good-bg)}
label.opt.no{border-color:var(--bad);background:var(--bad-bg)}
label.opt.off{opacity:.55}
.field{margin:0 0 12px}
.field label.l{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}

/* question runner */
.q-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.q-prompt{font-size:1.05rem}
.dots{letter-spacing:2px;color:var(--brand)}
.fb{border-radius:10px;padding:14px 18px;margin:14px 0 0;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:#b8dfc2}
.fb.part{background:var(--warn-bg);border-color:#f0d49b}
.fb.no{background:#fff7f7;border-color:#efbcbc}
.fb h4{margin:0 0 6px}
.rubric{list-style:none;padding:0;margin:8px 0}
.rubric li{display:flex;gap:8px;margin:5px 0;align-items:flex-start}
.rubric .mk{flex:0 0 auto;font-weight:800;width:1.2em;text-align:center}
.rubric .y .mk{color:var(--good)} .rubric .n .mk{color:var(--bad)}
.rubric .why{color:var(--muted);font-size:.9rem;display:block}
.model{background:#fff;border:1px dashed #9aa5c4;border-radius:8px;padding:10px 14px;margin-top:10px}
.model b.t{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:block;margin-bottom:2px}
.misc{background:var(--warn-bg);border:1px solid #f0d49b;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:.95rem}

/* predict / reveal */
.predict{border:2px dashed #8b9bd6;border-radius:12px;padding:14px 18px;margin:0 0 16px;background:#fbfcff}
.predict .tag{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-d)}
.reveal{margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--good-bg);border:1px solid #b8dfc2}

/* worked example */
.stages{display:flex;gap:8px;margin-bottom:12px}
.stages span{padding:3px 12px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.stages span.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.stages span.done{background:var(--good-bg);color:var(--good);border-color:#b8dfc2}
.steps{counter-reset:s;list-style:none;padding:0}
.steps>li{counter-increment:s;position:relative;padding:8px 10px 8px 42px;margin:6px 0;border:1px solid var(--line);border-radius:9px;background:#fff}
.steps>li::before{content:counter(s);position:absolute;left:10px;top:8px;width:24px;height:24px;border-radius:50%;background:var(--brand-bg);color:var(--brand-d);font-weight:700;text-align:center;line-height:24px;font-size:.85rem}
.steps>li.blank{border-style:dashed;border-color:#8b9bd6;background:#fbfcff}
.steps select{width:auto;max-width:100%;display:inline-block;padding:3px 8px}

/* section pager */
.pager{display:flex;gap:6px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.pager button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:.8rem;font-weight:700;color:var(--muted)}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager button.seen{background:var(--good-bg);border-color:#b8dfc2;color:var(--good)}
.pager button.opt{border-style:dashed}

/* flashcards */
.fc-wrap{perspective:1200px;max-width:720px;margin:0 auto}
.fc{display:grid;min-height:250px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.fc.flip{transform:rotateY(180deg)}
.fc .face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 30px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.fc .back{transform:rotateY(180deg);background:#fcfdff}
.fc .face .lab{position:absolute;top:10px;left:16px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fc .face .big{font-size:1.2rem;font-weight:600}
.rate{display:flex;gap:10px;justify-content:center;margin-top:16px}
.rate .btn{min-width:140px;justify-content:center}
.rate .again{border-color:#e3a6a6;color:var(--bad)} .rate .hard{border-color:#e6c27f;color:var(--warn)} .rate .easy{border-color:#9fd2ac;color:var(--good)}
.boxes{display:flex;gap:4px}.boxes i{width:14px;height:6px;border-radius:3px;background:var(--line)}.boxes i.f{background:var(--brand)}

/* games */
.gm{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gm button.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;margin:0 0 8px;font-size:.95rem}
.gm button.tile:hover{border-color:var(--brand)}
.gm button.tile.sel{border-color:var(--brand);background:var(--brand-bg);box-shadow:0 0 0 2px var(--brand-bg)}
.gm button.tile.done{border-color:var(--good);background:var(--good-bg);opacity:.6;pointer-events:none}
.gm button.tile.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bucketrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.bucket{border:2px solid var(--line);background:#fff;border-radius:11px;padding:14px;font-weight:600;text-align:center}
.bucket:hover{border-color:var(--brand)} .bucket small{display:block;font-weight:400;color:var(--muted)}
.bigcard{font-size:1.15rem;border:1px solid var(--line);background:#fff;border-radius:12px;padding:22px;text-align:center;box-shadow:var(--shadow);min-height:90px;display:flex;align-items:center;justify-content:center}
.ord{list-style:none;padding:0;margin:0}
.ord li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;margin:6px 0;cursor:grab}
.ord li.drag{opacity:.4} .ord li.ok{border-color:var(--good);background:var(--good-bg)} .ord li.no{border-color:#e6c27f;background:var(--warn-bg)}
.ord li .grow{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.3rem}

/* widgets */
.widget{border:1px solid #c5cffa;background:#fbfcff;border-radius:12px;padding:16px 18px;margin:0 0 16px}
.widget>.wt{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-d);margin-bottom:8px;display:flex;gap:10px;align-items:center}
.ctl{display:grid;grid-template-columns:230px 1fr 56px;gap:10px;align-items:center;margin:6px 0;font-size:.93rem}
.ctl output{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 14px;min-width:150px}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:var(--soft);border-radius:10px;padding:8px;min-height:130px}
.col h5{margin:0 0 6px;font-size:.85rem;display:flex;justify-content:space-between}
.col.full{outline:2px solid var(--bad)}
.kc{background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin:4px 0;font-size:.85rem;position:relative;overflow:hidden}
.kc i{position:absolute;left:0;bottom:0;height:3px;background:var(--brand)}
.dep{display:grid;grid-template-columns:1fr 40px 1fr;gap:8px;align-items:center;margin:8px 0}
.dep .n{border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;text-align:left;font-weight:600}
.dep .n.off{border-style:dashed;color:var(--muted);background:var(--soft)}
.dep .n.bad{border-color:var(--bad);background:var(--bad-bg)}
.dep .n small{display:block;font-weight:400;color:var(--muted)}
.dep .ar{text-align:center;font-size:1.3rem;color:var(--muted)}

/* glossary */
.gtable dt{font-weight:700;margin-top:14px} .gtable dd{margin:2px 0 0 0}
.gtable dt:target,.gtable dt.flash{background:#fff3bf;border-radius:6px;padding:2px 6px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px 26px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2233;color:#fff;padding:9px 18px;border-radius:99px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
#toast.show{opacity:1}
#banner{display:none;background:var(--warn-bg);color:var(--warn);padding:8px 20px;font-size:.9rem;border-bottom:1px solid #f0d49b;grid-column:1/3}
.summary{white-space:pre-wrap;font-family:var(--mono);font-size:.84rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;max-height:460px;overflow:auto}
.hide{display:none!important}
@media (max-width:1100px){#app{grid-template-columns:1fr}#nav{display:none}#top .meter{display:none}}
@media (max-width:760px){.grid2,.grid3,.gm{grid-template-columns:1fr}.ctl{grid-template-columns:1fr}#main{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.fc{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app">
  <header id="top">
    <a class="brand" href="#/">SE 101 Study Site</a>
    <span class="chip brand" title="Thursday 26 November 2026, cumulative">Quiz 2: Thu 26 Nov</span>
    <span class="grow"></span>
    <div class="meter" id="topmeter" aria-label="Lesson 1 progress"></div>
    <button class="btn sm" id="btn-help" aria-haspopup="dialog" title="Keyboard shortcuts (?)">Shortcuts <kbd>?</kbd></button>
  </header>
  <div id="banner" role="status"></div>
  <nav id="nav" aria-label="Site"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="overlay" id="ov" role="dialog" aria-modal="true"><div class="modal" id="ovbox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ==== 10-core.js ==== */
/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = a => a.reduce((x, y) => x + y, 0);
const DAY = 86400000;
function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a, rnd = Math.random) { return a[Math.floor(rnd() * a.length)]; }
function pad2(n) { return String(n).padStart(2, '0'); }

/* ---------- persistent store (localStorage with in-memory fallback) ---------- */
const Store = {
  key: 'se101.study.v1', data: null, ok: true, timer: null,
  fresh() { return { v: 1, created: Date.now(), steps: {}, q: {}, obj: {}, cards: {}, games: {}, missed: [], pred: {}, we: {}, seen: {}, settings: { depth: 'core' }, session: { n: 0 } }; },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.key); } catch (e) { this.ok = false; }
    try { this.data = raw ? Object.assign(this.fresh(), JSON.parse(raw)) : this.fresh(); } catch (e) { this.data = this.fresh(); }
    this.data.session = this.data.session || { n: 0 };

  },
  save() { clearTimeout(this.timer); this.timer = setTimeout(() => this.saveNow(), 120); },

    catch (e) { this.ok = false; }
    const b = document.getElementById('banner');
    if (b) { b.style.display = this.ok ? 'none' : 'block'; if (!this.ok) b.textContent = 'This browser is not allowing the page to save progress. Everything works, but progress will be lost when you close the tab.'; }

/* ---------- syntax highlighting (offline, small) ---------- */
const HL = {
  python: { kw: 'def return if else elif for while in not and or is None True False import from as with class lambda raise try except assert pass yield del', bi: 'len min max sum sorted range print list dict set tuple str int float isinstance next', cm: '#' },
  sql: { kw: 'SELECT FROM WHERE ORDER BY LIMIT INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE PRIMARY KEY FOREIGN REFERENCES NOT NULL IS AND OR JOIN ON AS START TRANSACTION COMMIT ROLLBACK UNIQUE AUTO_INCREMENT DEFAULT CASCADE GRANT TO USER IDENTIFIED', bi: 'NOW CURDATE DATE INT VARCHAR DATETIME BOOLEAN', cm: '--' },
  shell: { kw: 'git pytest python', bi: 'switch merge commit push pull fetch branch reset rebase add log status diff checkout restore revert clone', cm: '#' },
  text: { kw: '', bi: '', cm: '' },
};
function highlight(code, lang = 'python') {
  const L = HL[lang] || HL.text;
  const kw = new Set(L.kw.split(' ').filter(Boolean)), bi = new Set(L.bi.split(' ').filter(Boolean));
  const ci = lang === 'sql';
  return code.split('\n').map(line => {
    let mark = false;
    if (line.startsWith('»')) { mark = true; line = line.slice(1); }
    let out = '', i = 0;
    while (i < line.length) {
      const rest = line.slice(i);
      let m;
      if (L.cm && rest.startsWith(L.cm)) { out += `<span class="c">${esc(rest)}</span>`; break; }
      if ((m = /^("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')/.exec(rest))) { out += `<span class="s">${esc(m[0])}</span>`; i += m[0].length; continue; }
      if (lang === 'python' && (m = /^@[A-Za-z_][\w.]*/.exec(rest))) { out += `<span class="d">${esc(m[0])}</span>`; i += m[0].length; continue; }
      if ((m = /^\d+(?:\.\d+)?/.exec(rest))) { out += `<span class="n">${m[0]}</span>`; i += m[0].length; continue; }
      if ((m = /^[A-Za-z_][\w]*/.exec(rest))) {
        const w = m[0], key = ci ? w.toUpperCase() : w;
        let cls = '';
        if (kw.has(key)) cls = 'k'; else if (bi.has(key)) cls = 'b';
        else if (lang === 'python' && /^\s*\(/.test(rest.slice(w.length))) cls = 'f';
        out += cls ? `<span class="${cls}">${esc(w)}</span>` : esc(w); i += w.length; continue;
      }
      out += esc(line[i]); i++;
    }
    return mark ? `<span class="hl">${out}</span>` : out;
  }).join('\n');
}
function codeBlock(code, lang = 'python', label = '') { return `<pre class="code" ${label ? `aria-label="${esc(label)}"` : ''}><code>${highlight(code.replace(/\n$/, ''), lang)}</code></pre>`; }

/* ---------- glossary + first-appearance links ---------- */
const GLOSS = {};            // id -> {term, def, lesson, first}
const Terms = {
  seen: new Set(),
  process(html, loc) {
    return html.replace(/\{\{([a-z0-9-]+)(?:\|([^}]+))?\}\}/g, (all, id, txt) => {
      const g = GLOSS[id];
      if (!g) return `<span class="gl" style="color:#b42323">[?${esc(id)}]</span>`;
      const first = !Terms.seen.has(id);

      return `<a class="gl${first ? ' first' : ''}" href="#/glossary/${id}" data-term="${id}" title="${esc(g.def.replace(/<[^>]+>/g, '').slice(0, 160))}">${txt || esc(g.term)}</a>`;
    });

};

/* ---------- icons: arrows and marks drawn as inline SVG so they never depend on installed fonts ---------- */
const ICONS = {
  '\u2192': ['arrowR', 'M3 12h17M14 6l6 6-6 6', ''], '\u2190': ['arrowL', 'M21 12H4M10 6l-6 6 6 6', ''],
  '\u2191': ['arrowU', 'M12 21V4M6 10l6-6 6 6', ''], '\u2193': ['arrowD', 'M12 3v17M6 14l6 6 6-6', ''],
  '\u2713': ['check', 'M4 12.5l5 5L20 6.5', 'done'], '\u2717': ['cross', 'M6 6l12 12M18 6L6 18', 'missed'], '\u2715': ['cross', 'M6 6l12 12M18 6L6 18', 'missed'],
  '\u25CF': ['dotF', 'M12 5a7 7 0 100 14 7 7 0 000-14z', '', 'fill'], '\u25CB': ['dotE', 'M12 5.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13z', ''],
  '\u25A0': ['sq', 'M5 5h14v14H5z', '', 'fill'], '\u25C6': ['dia', 'M12 3l9 9-9 9-9-9z', '', 'fill'],
};
const ICON_CH = Object.keys(ICONS).join('');
const ICON_RE = new RegExp('[' + ICON_CH + ']');
const ICON_SPLIT = new RegExp('([' + ICON_CH + '])');
function iconEl(ch) {
  const d = ICONS[ch], s = document.createElement('span');
  s.className = 'ic' + (d[3] ? ' ' + d[3] : '');
  if (d[2]) { s.setAttribute('role', 'img'); s.setAttribute('aria-label', d[2]); } else s.setAttribute('aria-hidden', 'true');
  s.innerHTML = `<svg viewBox="0 0 24 24" focusable="false"><path d="${d[1]}"/></svg>`;
  return s;
}
function iconify(root) {
  if (!root || !root.nodeType) return;
  const base = root.nodeType === 3 ? root.parentNode : root;
  if (!base || !base.querySelectorAll) return;
  const w = document.createTreeWalker(root.nodeType === 3 ? base : root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      const p = n.parentNode;
      if (!p || /^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION|TITLE)$/.test(p.nodeName)) return NodeFilter.FILTER_REJECT;
      if (p.closest && p.closest('svg,pre,.summary,.noicon')) return NodeFilter.FILTER_REJECT;
      return ICON_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    },
  });
  const list = []; while (w.nextNode()) list.push(w.currentNode);
  list.forEach(n => {
    const frag = document.createDocumentFragment();
    n.nodeValue.split(ICON_SPLIT).forEach(part => { if (part && ICONS[part]) frag.appendChild(iconEl(part)); else if (part) frag.appendChild(document.createTextNode(part)); });
    n.parentNode.replaceChild(frag, n);
  });
}
function startIcons() {
  iconify(document.body);
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1 || n.nodeType === 3) iconify(n); }))).observe(document.body, { childList: true, subtree: true });
}

/* ---------- progress, mastery, steps ---------- */
const LESSONS = {};   // id -> lesson object (registered by content parts)
const QBANK = {};     // qid -> question
const Views = {};     // name -> render function(el, params)

const Progress = {
  recordQ(q, score, meta = {}) {
    const d = S(), ts = Date.now();
    const qs = d.q[q.id] || (d.q[q.id] = { n: 0, hist: [] });
    qs.n++; qs.hist.push(score); qs.hist = qs.hist.slice(-8); qs.last = score; qs.ts = ts;
    if (meta.self) qs.self = true;
    const ob = d.obj[q.obj] || (d.obj[q.obj] = { hist: [] });
    ob.hist.push({ s: score, d: q.diff, ts, q: q.id }); ob.hist = ob.hist.slice(-12);
    const i = d.missed.indexOf(q.id);
    if (score === 0 && i < 0) d.missed.push(q.id);
    if (score > 0 && i >= 0) d.missed.splice(i, 1);
    Store.save();
  },
  /* the learner overrides the automatic check */
  override(q, score) {
    const d = S(), qs = d.q[q.id];
    if (qs && qs.hist.length) { qs.hist[qs.hist.length - 1] = score; qs.last = score; qs.self = true; }
    const ob = d.obj[q.obj];
    if (ob) { for (let k = ob.hist.length - 1; k >= 0; k--) if (ob.hist[k].q === q.id) { ob.hist[k].s = score; break; } }
    const i = d.missed.indexOf(q.id);
    if (score === 0 && i < 0) d.missed.push(q.id);
    if (score > 0 && i >= 0) d.missed.splice(i, 1);
    Store.save();
  },
  mastery(oid) {
    const h = ((S().obj[oid] || {}).hist || []).slice(-8);
    const n = h.length;
    if (!n) return { p: 0, n: 0, label: 'Not started', cls: '' };
    const w = h.map(e => 1 + 0.5 * (e.d - 1));
    const p = sum(h.map((e, i) => e.s * w[i])) / sum(w);
    const hard = h.some(e => e.d >= 3 && e.s >= 0.5);
    let label, cls;
    if (p >= 0.8 && n >= 4 && hard) { label = 'Mastered'; cls = 'good'; }
    else if (p >= 0.6 && n >= 3) { label = 'Developing'; cls = 'brand'; }
    else { label = n < 3 ? 'Learning' : 'Needs work'; cls = n < 3 ? 'brand' : 'warn'; }
    return { p, n, label, cls, hard };
  },
  cardKnown(oid, lesson) {
    const cards = lesson.cards.filter(c => c.obj === oid);
    if (!cards.length) return { known: 0, total: 0 };
    return { known: cards.filter(c => ((S().cards[c.id] || {}).box || 0) >= 3).length, total: cards.length };
  },
  step(id) { if (!S().steps[id]) { S().steps[id] = Date.now(); Store.save(); App.refreshChrome(); } },
  stepDone(id) { return !!S().steps[id]; },
  lessonProgress(lesson) {
    const ids = lesson.steps.map(s => s.id), done = ids.filter(id => S().steps[id]).length;
    return { done, total: ids.length, p: ids.length ? done / ids.length : 0 };
  },
  missedQs() { return S().missed.map(id => QBANK[id]).filter(Boolean); },
};

/* ---------- answer checking ---------- */
function norm(s) {
  return ' ' + String(s).toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"')
    .replace(/[^a-z0-9%'\- ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
}
function pointHit(p, t) {
  if (p.of) { const hits = p.of.filter(g => g.some(r => r.test(t))).length; return hits >= (p.min || p.of.length); }
  if (p.any && p.any.some(r => r.test(t))) return true;
  if (p.all && p.all.every(g => g.some(r => r.test(t)))) return true;
  return false;
}
/* rubric: list of {label, any:[RegExp], all:[[RegExp]], why, nudge, w, misc} */
function gradeRubric(q, text) {
  const t = norm(text);
  const pts = q.rubric.map(p => ({ p, ok: pointHit(p, t), w: p.w == null ? 1 : p.w }));
  const tot = sum(pts.map(x => x.w)), got = sum(pts.filter(x => x.ok).map(x => x.w));
  const ratio = tot ? got / tot : 0;
  const need = q.passAt == null ? 1 : q.passAt;
  const miscs = (q.misc || []).filter(m => m.re.test(t)).map(m => m.msg);
  pts.forEach(x => { if (!x.ok && x.p.misc) miscs.push(x.p.misc); });
  return { pts, got, tot, ratio, pass: ratio + 1e-9 >= need, miscs: Array.from(new Set(miscs)).slice(0, 2) };
}
function parseNum(s) { const m = /-?\d+(?:\.\d+)?/.exec(String(s).replace(/,/g, '')); return m ? parseFloat(m[0]) : NaN; }
function gradeQuestion(q, inp) {
  switch (q.type) {
    case 'mcq': { const o = q.options[inp.idx]; return { pass: !!(o && o.ok), opt: o }; }
    case 'numeric': {
      const res = q.fields.map((f, i) => { const v = parseNum(inp.vals[i]); return { ok: !isNaN(v) && Math.abs(v - f.answer) <= (f.tol || 0) + 1e-9, v }; });
      return { pass: res.every(r => r.ok), res };
    }
    case 'written': { const r = gradeRubric(q, inp.text); return Object.assign(r, { choiceOk: true }); }
    case 'tf': case 'choice': {
      const r = gradeRubric(q, inp.text);
      const choiceOk = inp.choice === q.answer;
      return Object.assign(r, { choiceOk, pass: choiceOk && r.pass });
    }
  }
  return { pass: false };
}

/* ---------- question runner ---------- */
const TYPE_LABEL = { written: 'Written answer', mcq: 'Multiple choice', numeric: 'Numeric', tf: 'True or false, with reason', choice: 'Choose, then justify' };
const dotsFor = d => '●'.repeat(d) + '○'.repeat(3 - d);

function mountRunner(el, opts) {
  const bank = opts.bank.slice(), want = opts.n || bank.length;
  const asked = new Set(), later = [], requeued = new Set(), inject = [];
  const results = [];
  let level = opts.level0 || 1, countBank = 0, cq = null, finished = false;

  const qOf = id => QBANK[id];
  function pickFromBank() {
    if (countBank >= want) return null;
    const left = bank.filter(id => !asked.has(id));
    if (!left.length) return null;
    if (opts.adapt === false) return left[0];
    left.sort((a, b) => Math.abs(qOf(a).diff - level) - Math.abs(qOf(b).diff - level) || bank.indexOf(a) - bank.indexOf(b));
    return left[0];
  }
  function nextId() {
    if (inject.length) return { id: inject.shift(), tag: 'simpler' };
    const b = pickFromBank(); if (b) { countBank++; return { id: b, tag: '' }; }
    if (later.length) return { id: later.shift(), tag: 'revisit' };
    return null;
  }
  function advance() {
    const n = nextId();
    if (!n) return finish();
    asked.add(n.id);
    cq = { q: qOf(n.id), attempts: 0, hinted: false, final: false, tag: n.tag, idx: null, choice: null, score: null };
    render();
  }
  function head() {
    const q = cq.q, k = results.length + 1;
    return `<div class="q-head"><span class="chip brand">Question ${k}${cq.tag === '' && !opts.openEnded ? ' of ' + want : ''}</span>` +
      `<span class="chip">${TYPE_LABEL[q.type]}</span><span class="chip" title="Difficulty ${q.diff} of 3"><span class="dots">${dotsFor(q.diff)}</span></span>` +
      `<span class="chip">${esc(q.obj)}</span>${q.exam ? '<span class="chip good">Exam-style</span>' : ''}` +
      (cq.tag === 'simpler' ? '<span class="chip warn">A simpler question on the same idea</span>' : '') +
      (cq.tag === 'revisit' ? '<span class="chip warn">Revisiting a question you missed</span>' : '') + '</div>';
  }
  function inputHtml() {
    const q = cq.q;
    if (q.type === 'mcq') {
      return q.options.map((o, i) => `<label class="opt" data-i="${i}"><input type="radio" name="mc" value="${i}"><span><b>${'ABCDEFG'[i]}.</b> ${o.t}</span></label>`).join('');
    }
    if (q.type === 'numeric') {
      return q.fields.map((f, i) => `<div class="field"><label class="l" for="nf${i}">${f.label}</label><input type="text" inputmode="decimal" id="nf${i}" data-nf="${i}" autocomplete="off" style="max-width:220px"> ${f.unit ? `<span class="muted">${esc(f.unit)}</span>` : ''}</div>`).join('');
    }
    let pre = '';
    if (q.type === 'tf') pre = `<div class="row" style="margin-bottom:8px" role="radiogroup" aria-label="True or false"><label class="opt" style="margin:0" data-c="true"><input type="radio" name="tfc" value="true"><b>True</b></label><label class="opt" style="margin:0" data-c="false"><input type="radio" name="tfc" value="false"><b>False</b></label></div>`;
    if (q.type === 'choice') pre = `<div class="row" style="margin-bottom:8px" role="radiogroup">${q.choices.map((c, i) => `<label class="opt" style="margin:0" data-c="${esc(c)}"><input type="radio" name="tfc" value="${esc(c)}"><b>${esc(c)}</b></label>`).join('')}</div>`;
    const ph = q.type === 'written' ? 'Type your answer in your own words.' : 'Give the reason. The reason carries the mark: a bare choice earns nothing.';
    return pre + `<textarea id="ans" placeholder="${ph}" aria-label="Your answer"></textarea>`;
  }
  function render() {
    const q = cq.q;
    el.innerHTML = `<div class="card runner" data-qid="${q.id}">${head()}<div class="q-prompt">${q.prompt}</div><div class="qin" style="margin-top:12px">${inputHtml()}</div>
      <div class="qhint"></div>
      <div class="row qbtns" style="margin-top:12px"><button class="btn primary" data-a="submit">Submit <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button><button class="btn" data-a="hint">Hint <kbd>H</kbd></button><button class="btn ghost" data-a="giveup">I don't know</button></div>
      <div class="qfb" aria-live="polite"></div></div>`;
    renderMath(el);
    const f = $('#ans', el) || $('[data-nf]', el); if (f && opts.focus !== false) f.focus({ preventScroll: true });
  }
  function readInput() {
    const q = cq.q;
    if (q.type === 'mcq') { const r = $('input[name=mc]:checked', el); return r ? { idx: +r.value } : null; }
    if (q.type === 'numeric') { const vals = $$('[data-nf]', el).map(i => i.value.trim()); return vals.every(v => v !== '') ? { vals } : null; }
    const text = ($('#ans', el).value || '').trim();
    let choice = null;
    if (q.type === 'tf' || q.type === 'choice') { const r = $('input[name=tfc]:checked', el); if (!r) return { missing: 'choice' }; choice = q.type === 'tf' ? r.value === 'true' : r.value; }
    if (!text) return { missing: 'text' };
    return { text, choice };
  }
  function showHint(auto) {
    const q = cq.q; if (cq.final) return;
    if (!auto) cq.hinted = true;
    $('.qhint', el).innerHTML = `<div class="callout" style="margin-top:12px"><b class="t">Hint</b>${q.hint || 'Re-read the section and try to name the key term.'}</div>`;
    renderMath(el);
  }
  function submit() {
    if (cq.final) return;
    const q = cq.q, inp = readInput();
    if (!inp || inp.missing) { toast(inp && inp.missing === 'choice' ? 'Choose an option first.' : q.type === 'numeric' ? 'Enter a number in each box.' : q.type === 'mcq' ? 'Select an option first.' : 'Write an answer first.'); return; }
    cq.attempts++; cq.inp = inp;
    const g = gradeQuestion(q, inp); cq.g = g;
    if (g.pass) return finalize(cq.attempts === 1 && !cq.hinted ? 1 : 0.5);
    if (cq.attempts === 1) return retry(g);
    finalize(0);
  }
  function lockInputs() { $$('input,textarea', $('.qin', el)).forEach(i => i.disabled = true); }
  /* first miss: specific feedback, hint to retry, no model answer yet */
  function retry(g) {
    const q = cq.q; let body = '';
    if (q.type === 'mcq') {
      const lab = $(`label[data-i="${cq.inp.idx}"]`, el); lab.classList.add('no'); lab.querySelector('input').disabled = true;
      body = `<p><b>Not that one.</b> ${g.opt.why || ''}</p>`;
    } else if (q.type === 'numeric') {
      body = `<p><b>Not quite.</b> ${g.res.map((r, i) => `${q.fields[i].label.replace(/<[^>]+>/g, '')}: ${r.ok ? 'correct' : 'check this one'}`).join('; ')}.</p>`;
    } else {
      if (!g.choiceOk) body += `<p><b>Check your choice.</b> ${q.wrong || 'The choice is not supported by the requirements in the scenario.'}</p>`;
      body += rubricHtml(g, false);
    }
    $('.qfb', el).innerHTML = `<div class="fb part"><h4>Not yet. Try once more.</h4>${body}${g.miscs && g.miscs.length ? miscHtml(g.miscs) : ''}
      <div class="row" style="margin-top:8px"><button class="btn primary sm" data-a="retry">Revise my answer</button><button class="btn sm" data-a="show">Show the model answer</button>${selfBtns(q)}</div></div>`;
    showHint(true);
    renderMath(el);
  }
  function rubricHtml(g, full) {
    if (!g.pts) return '';
    const li = g.pts.map(x => x.ok
      ? `<li class="y"><span class="mk">✓</span><span>${x.p.label}</span></li>`
      : full ? `<li class="n"><span class="mk">✗</span><span>${x.p.label}${x.p.why ? `<span class="why">${x.p.why}</span>` : ''}</span></li>`

  }
  const miscHtml = ms => ms.map(m => `<div class="misc"><b>Likely misconception.</b> ${m}</div>`).join('');
  const selfBtns = q => (q.type === 'mcq' || q.type === 'numeric') ? '' : `<button class="btn sm ghost" data-a="selfok" title="If the automatic check missed your point">Mark myself correct <kbd>C</kbd></button>`;
  function finalize(score, forced) {
    const q = cq.q, g = cq.g || {}; cq.final = true; cq.score = score;
    lockInputs();
    Progress.recordQ(q, score);
    results.push({ id: q.id, score, tag: cq.tag, extra: cq.tag !== '' });
    if (cq.tag === '' || cq.tag === 'revisit') { if (score === 1) level = Math.min(3, level + 1); else if (score === 0) level = Math.max(1, level - 1); }
    let verdict, cls;
    if (score === 1) { verdict = 'Correct'; cls = 'ok'; } else if (score === 0.5) { verdict = 'Correct, with help'; cls = 'ok'; } else { verdict = 'Not yet'; cls = 'no'; }
    let body = '';
    if (q.type === 'mcq') {
      $$('label.opt', el).forEach((lab, i) => { lab.classList.remove('no'); if (q.options[i].ok) lab.classList.add('ok'); else if (cq.inp && i === cq.inp.idx) lab.classList.add('no'); else lab.classList.add('off'); });
      const right = q.options.findIndex(o => o.ok);
      body = (cq.inp && !q.options[cq.inp.idx].ok ? `<p><b>Your choice (${'ABCDEFG'[cq.inp.idx]}).</b> ${q.options[cq.inp.idx].why || ''}</p>` : '') + `<p><b>Correct answer (${'ABCDEFG'[right]}).</b> ${q.options[right].why || ''}</p>`;
    } else if (q.type === 'numeric') {
      body = `<ul class="rubric">${q.fields.map((f, i) => { const ok = g.res && g.res[i] && g.res[i].ok; return `<li class="${ok ? 'y' : 'n'}"><span class="mk">${ok ? '✓' : '✗'}</span><span>${f.label}: <b>${f.answer}</b>${f.unit ? ' ' + esc(f.unit) : ''}${ok ? '' : ` <span class="muted">(you entered ${esc(cq.inp.vals[i])})</span>`}</span></li>`; }).join('')}</ul>`;
    } else {
      if (!g.choiceOk) body += `<p><b>Your choice was not the best one.</b> ${q.wrong || ''}</p>`;
      body += rubricHtml(g, true) + (g.miscs && g.miscs.length ? miscHtml(g.miscs) : '');
    }
    if (q.explain) body += `<p>${q.explain}</p>`;
    if (q.model) body += `<div class="model"><b class="t">Model answer</b>${q.model}</div>`;
    const more = [];
    if (score === 0) {
      if (q.simpler && !asked.has(q.simpler) && QBANK[q.simpler]) { inject.push(q.simpler); more.push('A simpler question on the same idea comes next.'); }
      if (!requeued.has(q.id) && opts.requeue !== false) { later.push(q.id); requeued.add(q.id); more.push('This one will return later in this set.'); }
    }
    const last = !peek();
    $('.qfb', el).innerHTML = `<div class="fb ${cls}"><h4>${verdict}</h4>${body}${more.length ? `<p class="muted small">${more.join(' ')}</p>` : ''}
      <div class="row" style="margin-top:8px"><button class="btn primary" data-a="next">${last ? 'Finish' : 'Next question'} <kbd>N</kbd></button>${score < 1 ? selfBtns(q) : ''}${score === 1 ? selfBadBtn(q) : ''}</div></div>`;
    $('.qbtns', el).classList.add('hide');
    renderMath(el);
    const nb = $('[data-a=next]', el); if (nb) nb.focus({ preventScroll: true });
    $('.qfb', el).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    opts.onAnswer && opts.onAnswer(q, score);
  }
  const selfBadBtn = q => (q.type === 'mcq' || q.type === 'numeric') ? '' : `<button class="btn sm ghost" data-a="selfno" title="If the automatic check was too generous">Mark myself incorrect <kbd>X</kbd></button>`;
  function peek() {
    if (inject.length || later.length) return true;
    if (countBank < want && bank.some(id => !asked.has(id))) return true;
    return false;
  }
  function selfMark(ok) {
    if (!cq || !cq.q || (cq.q.type === 'mcq' || cq.q.type === 'numeric')) return;
    if (!cq.final) { cq.attempts = Math.max(cq.attempts, 1); finalize(ok ? 0.5 : 0); }
    const q = cq.q, score = ok ? (cq.attempts === 1 && !cq.hinted ? 1 : 0.5) : 0;
    Progress.override(q, score);
    const r = results[results.length - 1]; if (r) r.score = score;
    // keep the queue consistent with the override
    const li = later.indexOf(q.id); if (ok && li >= 0) later.splice(li, 1);
    if (!ok && !requeued.has(q.id) && opts.requeue !== false) { later.push(q.id); requeued.add(q.id); }
    toast(ok ? 'Marked correct. Your own judgement overrides the check.' : 'Marked incorrect. It will come back later.');
    const h = $('.fb h4', el); if (h) h.textContent = ok ? 'Marked correct by you' : 'Marked incorrect by you';
    opts.onAnswer && opts.onAnswer(q, score, true);
  }
  function giveUp() {
    if (cq.final) return;
    cq.attempts = Math.max(cq.attempts, 2);
    cq.g = cq.g || { pts: cq.q.rubric ? cq.q.rubric.map(p => ({ p, ok: false })) : null, miscs: [], choiceOk: true, res: cq.q.fields ? cq.q.fields.map(() => ({ ok: false })) : null, pass: false };
    cq.inp = cq.inp || { idx: -1, vals: cq.q.fields ? cq.q.fields.map(() => '') : [] };
    finalize(0);
  }
  function finish() {
    if (finished) return; finished = true;
    const firstTry = results.filter(r => r.score === 1).length, help = results.filter(r => r.score === 0.5).length, missed = results.filter(r => r.score === 0).length;
    App.onKey = null;
    opts.onDone && opts.onDone({ results, firstTry, help, missed });
    if (opts.summaryEl !== false) {
      el.innerHTML = `<div class="card"><h3>${esc(opts.doneTitle || 'Set complete')}</h3>
      <div class="stat"><div><b>${firstTry}</b>correct first time</div><div><b>${help}</b>correct with a hint or retry</div><div><b>${missed}</b>to revisit</div></div>
      <p class="muted">${missed ? 'Missed questions are saved and come back in the Mixed Review.' : 'Nothing is outstanding from this set.'}</p>
      <div class="row">${opts.doneButtons || ''}</div></div>`;
    }
  }
  el.onclick = e => {
    const b = e.target.closest('[data-a]'); if (b) {
      const a = b.dataset.a;
      if (a === 'submit') submit(); else if (a === 'hint') showHint(); else if (a === 'giveup') giveUp();
      else if (a === 'next') advance(); else if (a === 'retry') doRetry(); else if (a === 'show') giveUp();
      else if (a === 'selfok') selfMark(true); else if (a === 'selfno') selfMark(false);
      return;
    }
    const lab = e.target.closest('label.opt'); if (lab && !cq.final) { $$('label.opt', el).forEach(l => l.classList.remove('sel')); lab.classList.add('sel'); }
  };
  el.onchange = e => { const lab = e.target.closest('label.opt'); if (lab && cq && !cq.final) { $$('label.opt', lab.parentElement).forEach(l => l.classList.remove('sel')); lab.classList.add('sel'); } };
  function doRetry() {
    $('.qfb', el).innerHTML = '';
    const q = cq.q;
    if (q.type === 'mcq') { $$('input[name=mc]', el).forEach(i => { i.checked = false; }); $$('label.opt', el).forEach(l => l.classList.remove('sel')); }
    const f = $('#ans', el) || $$('[data-nf]', el)[0]; if (f) f.focus();
  }
  App.onKey = (e, typing) => {
    if (!cq) return;
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Enter' && mod) { e.preventDefault(); cq.final ? advance() : submit(); return; }
    if (typing) return;
    const k = e.key.toLowerCase();
    if (cq.final) { if (k === 'n' || k === 'enter') { e.preventDefault(); advance(); } else if (k === 'c') selfMark(true); else if (k === 'x') selfMark(false); return; }
    if (k === 'h') { showHint(); return; }
    if (cq.q.type === 'mcq') {
      const idx = '1234567'.indexOf(k) >= 0 && k ? '1234567'.indexOf(k) : 'abcdefg'.indexOf(k);
      if (idx >= 0 && idx < cq.q.options.length && k.length === 1) { const r = $(`input[name=mc][value="${idx}"]`, el); if (r && !r.disabled) { r.checked = true; $$('label.opt', el).forEach(l => l.classList.remove('sel')); r.closest('label').classList.add('sel'); } }
      if (k === 'enter') { e.preventDefault(); submit(); }
    } else if (!cq.final && $('.qfb .fb', el)) { if (k === 'c') selfMark(true); }
  };
  advance();
  return { destroy() { App.onKey = null; el.innerHTML = ''; el.onclick = null; el.onchange = null; }, results };
}

/* ==== 40-cards.js ==== */
/* ---------- flashcards: Leitner boxes, weakest first, keyboard rating ---------- */
const Cards = {
  INTERVALS: [0, 10 * 60e3, 8 * 3600e3, DAY, 2 * DAY, 4 * DAY],
  st(c) { return S().cards[c.id] || (S().cards[c.id] = { box: 0, lapses: 0, seen: 0, due: 0, again: 0, hard: 0, easy: 0 }); },
  /* higher = show sooner: known less (low box), wrong more often (lapses), new, overdue */
  priority(c, now = Date.now()) {
    const s = S().cards[c.id] || { box: 0, lapses: 0, seen: 0, due: 0 };
    return (5 - s.box) + 1.5 * s.lapses + (s.seen ? 0 : 1) + clamp((now - s.due) / DAY, 0, 2);
  },
  queue(lesson, mode) {
    const now = Date.now();
    let cs = lesson.cards.slice();
    if (mode === 'smart') cs = cs.filter(c => (S().cards[c.id] ? S().cards[c.id].due : 0) <= now);
    else if (mode === 'weak') cs = cs.filter(c => { const s = S().cards[c.id]; return s && s.seen && (s.lapses > 0 || s.box <= 1); });
    cs = shuffle(cs); // random tie-break
    if (mode !== 'all') cs.sort((a, b) => Cards.priority(b, now) - Cards.priority(a, now));
    return cs.map(c => c.id);
  },
  apply(c, r, now = Date.now()) {
    const s = Cards.st(c); s.seen++; s.last = now;
    if (r === 'again') { s.box = 0; s.lapses++; s.again++; s.due = now; }
    else if (r === 'hard') { s.box = Math.max(1, s.box - 1); s.hard++; s.due = now + Cards.INTERVALS[1]; }
    else { s.box = Math.min(5, s.box === 0 ? 2 : s.box + 1); s.easy++; s.due = now + Cards.INTERVALS[s.box]; }
    Store.save();
  },
  counts(lesson) {
    let n = 0, learning = 0, known = 0;
    lesson.cards.forEach(c => { const s = S().cards[c.id]; if (!s || !s.seen) n++; else if (s.box >= 3) known++; else learning++; });
    return { new: n, learning, known, total: lesson.cards.length };
  },
  weakest(lesson, k = 8) {
    return lesson.cards.filter(c => S().cards[c.id] && S().cards[c.id].seen).map(c => ({ c, p: Cards.priority(c) + 0 }))
      .sort((a, b) => b.p - a.p).slice(0, k).filter(x => (S().cards[x.c.id].lapses > 0 || S().cards[x.c.id].box <= 1)).map(x => x.c);
  },
};

Views.cards = function (el, lesson, params) {
  let mode = (params && params.mode) || 'smart';
  let queue = [], flipped = false, total = 0, done = 0, undo = null;
  const byId = Object.fromEntries(lesson.cards.map(c => [c.id, c]));

  function start(m) {
    mode = m; queue = Cards.queue(lesson, mode); total = queue.length; done = 0; flipped = false; undo = null; draw();
  }
  function boxes(c) { const b = (S().cards[c.id] || { box: 0 }).box; return `<span class="boxes" title="Box ${b} of 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= b ? 'f' : ''}"></i>`).join('')}</span>`; }
  function header() {
    const k = Cards.counts(lesson);
    return `<div class="row spread" style="margin-bottom:12px"><div><h2 style="margin:0">Flashcards</h2><span class="muted small">${k.total} cards · ${k.new} new · ${k.learning} learning · ${k.known} known</span></div>
    <div class="row" role="group" aria-label="Study mode">
      ${[['smart', 'Smart queue'], ['weak', 'Weak cards'], ['all', 'All cards']].map(([m, l]) => `<button class="btn sm ${mode === m ? 'primary' : ''}" data-mode="${m}">${l}</button>`).join('')}
    </div></div>
    <p class="muted small" style="margin-top:-4px">Order: cards you know least and miss most come first. Rate honestly: <b>Again</b> brings the card back in a few cards, <b>Hard</b> a little later, <b>Easy</b> pushes it out.</p>`;
  }
  function draw() {
    if (!queue.length) return finish();
    const c = byId[queue[0]];
    el.innerHTML = `${header()}
      <div class="row spread" style="max-width:720px;margin:0 auto 8px"><span class="chip">${done} of ${total} this round</span><span class="row" style="gap:8px">${boxes(c)}<span class="chip">${esc(c.obj)}</span><span class="chip">${esc(c.kind || 'fact')}</span></span></div>
      <div class="fc-wrap"><div class="fc ${flipped ? 'flip' : ''}" id="fc" role="button" tabindex="0" aria-label="Flashcard. Press space to flip.">
        <div class="face front"><span class="lab">Question</span><div class="big">${c.q}</div></div>
        <div class="face back"><span class="lab">Answer</span><div>${c.a}</div></div></div></div>
      <div class="rate ${flipped ? '' : 'hide'}" id="rate"><button class="btn again" data-r="again">Again <kbd>1</kbd></button><button class="btn hard" data-r="hard">Hard <kbd>2</kbd></button><button class="btn easy" data-r="easy">Easy <kbd>3</kbd></button></div>
      <p class="center muted small" style="margin-top:12px">${flipped ? 'Rate how well you recalled it.' : 'Say the answer to yourself first, then flip.'} <kbd>Space</kbd> flip · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> rate · <kbd>U</kbd> undo</p>`;
    renderMath(el);
    if (!flipped) $('#fc', el).focus({ preventScroll: true });
  }
  function flip() { flipped = !flipped; const f = $('#fc', el), r = $('#rate', el); if (!f) return; f.classList.toggle('flip', flipped); r.classList.toggle('hide', !flipped); $('.big', el); const p = $('p.center', el); if (p) p.firstChild.textContent = flipped ? 'Rate how well you recalled it. ' : 'Say the answer to yourself first, then flip. '; }
  function rate(r) {
    if (!flipped || !queue.length) return;
    const id = queue.shift(), c = byId[id];
    undo = { id, prev: JSON.parse(JSON.stringify(Cards.st(c))), queue: [id].concat(queue), done };
    Cards.apply(c, r);
    done++;
    if (r === 'again') queue.splice(Math.min(3, queue.length), 0, id);
    else if (r === 'hard') queue.splice(Math.min(8, queue.length), 0, id);
    const rated = lesson.cards.filter(x => (S().cards[x.id] || {}).seen).length;
    if (rated >= Math.min(15, lesson.cards.length)) Progress.step('cards');
    flipped = false; App.refreshChrome(); draw();
  }
  function doUndo() {
    if (!undo) { toast('Nothing to undo.'); return; }
    S().cards[undo.id] = undo.prev; Store.save(); queue = undo.queue; done = undo.done; undo = null; flipped = false; draw(); toast('Last rating undone.');
  }
  function finish() {
    const weak = Cards.weakest(lesson, 8), k = Cards.counts(lesson);
    const later = lesson.cards.filter(c => (S().cards[c.id] || { due: 0 }).due > Date.now()).length;
    el.innerHTML = `${header()}<div class="card"><h3>${total ? 'Round complete' : 'Nothing is due in this mode'}</h3>
      <div class="stat"><div><b>${k.known}</b>cards known (box 3+)</div><div><b>${k.learning}</b>still learning</div><div><b>${k.new}</b>not seen yet</div></div>
      ${weak.length ? `<h4>Weakest cards</h4><ul>${weak.map(c => `<li>${c.q}</li>`).join('')}</ul>` : '<p class="muted">No weak cards at the moment.</p>'}
      <div class="row"><button class="btn primary" data-mode="weak">Drill weak cards</button><button class="btn" data-mode="all">Go through all cards</button><a class="btn" href="#/l1/games">Try a game</a></div>
      ${later ? `<p class="muted small" style="margin-top:10px">${later} cards are scheduled for later. "Smart queue" shows them when they are due; "All cards" shows everything now.</p>` : ''}</div>`;
    renderMath(el);
  }
  el.onclick = e => {
    const m = e.target.closest('[data-mode]'); if (m) { start(m.dataset.mode); return; }
    const r = e.target.closest('[data-r]'); if (r) { rate(r.dataset.r); return; }
    if (e.target.closest('#fc')) flip();
  };
  App.onKey = (e, typing) => {
    if (typing) return;
    const k = e.key.toLowerCase();
    if (!$('#fc', el)) return;
    if ((k === ' ' || k === 'enter') && e.target.closest && e.target.closest('button,a')) return;
    if (k === ' ' || k === 'enter') { e.preventDefault(); flip(); }
    else if (k === '1' || k === 'a') rate('again');
    else if (k === '2' || k === 'h') rate('hard');
    else if (k === '3' || k === 'e') rate('easy');
    else if (k === 'u') doUndo();
  };
  start(mode);
};

/* ==== 50-games.js ==== */
/* ---------- memorization games: match, sort, order, timed recall ---------- */
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const plainNorm = s => String(s).toLowerCase().replace(/[^a-z0-9\- ]+/g, ' ').replace(/\s+/g, ' ').trim();
function acceptsRecall(input, aliases) {
  const x = plainNorm(input); if (!x) return false;
  return aliases.some(a => {
    const y = plainNorm(a); if (x === y) return true;
    const tol = y.length >= 9 ? 2 : y.length >= 5 ? 1 : 0;
    if (lev(x, y) <= tol) return true;
    return x.length <= y.length * 2 + 8 && (' ' + x + ' ').includes(' ' + y + ' ');
  });
}
function gameStat(key, fn) {
  const g = S().games[key] || (S().games[key] = { plays: 0 }); fn(g);
  const base = key.split('-')[0];
  if (base !== key) { const b = S().games[base] || (S().games[base] = { plays: 0 }); b.plays++; }
  Store.save(); Progress.step('game');
}

Views.games = function (el, lesson, params) {
  const G = lesson.games, which = params && params.game;
  if (!which) {
    el.innerHTML = `<h2>Memorization games</h2><p class="muted">Short rounds that drill the facts. Mistakes cost nothing: they are only recorded so you can see what to review. Play at least one round.</p>
    <div class="grid2">
      ${[['match', 'Match', 'Pair each term with its definition.', G.match ? 'Terms and definitions' : ''], ['sort', 'Sort', 'Classify scenarios and practices: which bet, which loop, who decides.', 'Rapid classification'], ['order', 'Order', 'Put the steps of a process in the correct order.', 'Sequences'], ['speed', 'Speed recall', 'Read a definition and type the term before the timer ends.', '60 seconds']]
        .map(([id, t, d, tag]) => `<div class="card flat"><h3>${t}</h3><p>${d}</p><div class="row spread"><span class="chip">${tag}</span><a class="btn primary" href="#/l1/games/${id}">Play</a></div>${gameBest(id)}</div>`).join('')}

function gameBest(id) {
  const g = S().games[id]; if (!g || !g.plays) return '<p class="tiny muted" style="margin:8px 0 0">Not played yet.</p>';
  return `<p class="tiny muted" style="margin:8px 0 0">Played ${g.plays}×${g.best != null ? ' · best: ' + g.best : ''}</p>`;
}

/* ---- match ---- */
function gMatch(el, lesson, back) {
  const pool = lesson.games.match.pairs, size = lesson.games.match.roundSize || 6;
  let set, L, R, selL = null, selR = null, matched = 0, mistakes = 0, t0 = 0, doneIds = new Set();
  function newRound() {
    set = shuffle(pool).slice(0, size); L = shuffle(set); R = shuffle(set); selL = selR = null; matched = 0; mistakes = 0; t0 = Date.now(); doneIds = new Set(); draw();
  }
  function draw() {
    el.innerHTML = `${back}<h2>Match</h2><p class="muted">Select a term, then its definition. ${matched} of ${set.length} matched · ${plural(mistakes, 'miss', 'misses')}.</p>
    <div class="gm"><div>${L.map(p => `<button class="tile ${doneIds.has(p.id) ? 'done' : ''} ${selL === p.id ? 'sel' : ''}" data-l="${p.id}"><b>${p.t}</b></button>`).join('')}</div>
    <div>${R.map(p => `<button class="tile ${doneIds.has(p.id) ? 'done' : ''} ${selR === p.id ? 'sel' : ''}" data-r="${p.id}">${p.d}</button>`).join('')}</div></div>`;
    renderMath(el);
  }
  function finish() {
    const secs = Math.round((Date.now() - t0) / 1000);
    gameStat('match', g => { g.plays++; g.best = g.best == null ? mistakes + ' misses' : (mistakes < parseInt(g.best) ? mistakes + ' misses' : g.best); });
    el.innerHTML = `${back}<div class="card"><h3>Round complete</h3><div class="stat"><div><b>${secs}s</b>time</div><div><b>${mistakes}</b>misses</div></div>
      <p class="muted">${mistakes === 0 ? 'A clean round.' : 'Misses are normal. Say each pair aloud once, then play again.'}</p>
      <div class="row"><button class="btn primary" id="again">Play another round</button><a class="btn" href="#/l1/games">Other games</a><a class="btn" href="#/l1/cards">Flashcards</a></div></div>`;
    $('#again', el).onclick = newRound;
  }
  function tryPair() {
    if (selL == null || selR == null) return;
    if (selL === selR) {
      doneIds.add(selL); matched++; selL = selR = null; draw(); if (matched === set.length) finish();
    } else {
      mistakes++;
      const a = $(`[data-l="${selL}"]`, el), b = $(`[data-r="${selR}"]`, el);
      a.classList.add('shake'); b.classList.add('shake');
      selL = selR = null; setTimeout(() => { if (el.isConnected) draw(); }, 420);
    }
  }
  el.onclick = e => {
    const l = e.target.closest('[data-l]'), r = e.target.closest('[data-r]');
    if (l) { selL = l.dataset.l; draw(); tryPair(); } else if (r) { selR = r.dataset.r; draw(); tryPair(); }
  };
  newRound();
}

/* ---- sort ---- */
function gSort(el, lesson, back, deckId) {
  const decks = lesson.games.sort;
  if (!deckId) {
    el.innerHTML = `${back}<h2>Sort</h2><p class="muted">Choose a deck. Each round shows ten items. Press the bucket's number key or click it.</p><div class="grid2">${decks.map(d => `<div class="card flat"><h3>${d.title}</h3><p class="small muted">${d.blurb}</p><a class="btn primary" href="#/l1/games/sort/${d.id}">Start</a>${gameBest('sort-' + d.id)}</div>`).join('')}</div>`;
    return;
  }
  const deck = decks.find(d => d.id === deckId) || decks[0];
  let items, i = 0, right = 0, answered = false, again = [], total = 10;
  function newRound() { items = shuffle(deck.items).slice(0, 10); total = items.length; i = 0; right = 0; again = []; answered = false; draw(); }
  function draw() {
    if (i >= items.length) return finish();
    const it = items[i];
    el.innerHTML = `${back}<h2>${deck.title}</h2><div class="row spread"><span class="chip">${Math.min(i + 1, items.length)} of ${items.length}</span><span class="chip good">${right} right first time</span></div>
      <div class="bigcard" style="margin-top:10px">${it.t}</div>
      <div class="bucketrow">${deck.buckets.map((b, k) => `<button class="bucket" data-b="${b.id}">${b.label}<small>${b.sub || ''}</small><kbd>${k + 1}</kbd></button>`).join('')}</div>
      <div id="sfb" aria-live="polite" style="margin-top:12px"></div>`;
    answered = false; renderMath(el);
  }
  function choose(bid) {
    if (answered) return; answered = true;
    const it = items[i], ok = it.b === bid;
    if (ok) { if (!it.retry) right++; } else if (!it.retry) { again.push(Object.assign({}, it, { retry: true })); }
    const bk = deck.buckets.find(b => b.id === it.b);
    $('#sfb', el).innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><h4>${ok ? 'Right' : 'Not quite'}: ${bk.label}</h4><p>${it.why}</p><button class="btn primary" data-n="1">Next <kbd>Enter</kbd></button></div>`;
    $$('.bucket', el).forEach(b => { b.disabled = true; if (b.dataset.b === it.b) b.style.borderColor = 'var(--good)'; else if (b.dataset.b === bid) b.style.borderColor = 'var(--bad)'; });
    $('[data-n]', el).focus();
  }
  function next() { i++; if (i >= items.length && again.length) { items = items.concat(again.splice(0)); } draw(); }
  function finish() {
    const first = right;
    gameStat('sort-' + deck.id, g => { g.plays++; g.best = Math.max(g.best || 0, first); });
    el.innerHTML = `${back}<div class="card"><h3>Round complete</h3><div class="stat"><div><b>${first}/${total}</b>right first time</div></div>
      <p class="muted">Items you missed were shown again. Repeat until the first-time score is nearly perfect.</p>
      <div class="row"><button class="btn primary" id="again">Another round</button><a class="btn" href="#/l1/games/sort">Other decks</a><a class="btn" href="#/l1/games">All games</a></div></div>`;
    $('#again', el).onclick = newRound;
  }
  el.onclick = e => { const b = e.target.closest('[data-b]'); if (b) choose(b.dataset.b); else if (e.target.closest('[data-n]')) next(); };
  App.onKey = (e, typing) => {
    if (typing) return; const k = e.key;
    if (answered && (k === 'Enter' || k === ' ' || k.toLowerCase() === 'n')) { if (e.target.closest && e.target.closest('button')) return; e.preventDefault(); next(); return; }
    const n = parseInt(k, 10); if (!answered && n >= 1 && n <= deck.buckets.length) choose(deck.buckets[n - 1].id);
  };
  newRound();
}

/* ---- order ---- */
function gOrder(el, lesson, back) {
  const decks = lesson.games.order; let di = 0, cur = [], checked = false, dragI = null;
  function load() { const d = decks[di]; let s; do { s = shuffle(d.steps.map((t, k) => ({ t, k }))); } while (s.every((x, k) => x.k === k) && d.steps.length > 1); cur = s; checked = false; draw(); }
  function draw() {
    const d = decks[di];
    el.innerHTML = `${back}<h2>Order the steps</h2><div class="row" role="group" aria-label="Choose a sequence">${decks.map((x, k) => `<button class="btn sm ${k === di ? 'primary' : ''}" data-d="${k}">${x.title}</button>`).join('')}</div>
      <p class="muted" style="margin-top:10px">${d.prompt} Use the arrows, drag a row, or focus a row and press <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd>.</p>
      <ol class="ord" id="ord">${cur.map((x, p) => `<li draggable="true" tabindex="0" data-p="${p}" class="${checked ? (x.k === p ? 'ok' : 'no') : ''}"><span class="chip">${p + 1}</span><span class="grow">${x.t}</span><button class="btn sm" data-mv="-1" aria-label="Move up">↑</button><button class="btn sm" data-mv="1" aria-label="Move down">↓</button></li>`).join('')}</ol>
      <div class="row"><button class="btn primary" data-c="check">Check order</button><button class="btn" data-c="show">Show the answer</button><button class="btn ghost" data-c="new">Shuffle again</button></div>
      <div id="ofb" style="margin-top:12px" aria-live="polite"></div>`;
    renderMath(el);
  }
  function move(p, dlt) { const q = p + dlt; if (q < 0 || q >= cur.length) return; [cur[p], cur[q]] = [cur[q], cur[p]]; checked = false; draw(); const li = $(`li[data-p="${q}"]`, el); if (li) li.focus(); }
  function check() {
    checked = true; const wrong = cur.filter((x, p) => x.k !== p).length; draw();
    const ok = wrong === 0;
    gameStat('order', g => { g.plays++; if (ok) g.best = (g.best || 0) + 1; });
    $('#ofb', el).innerHTML = `<div class="fb ${ok ? 'ok' : 'part'}"><h4>${ok ? 'Correct order' : plural(wrong, 'step') + ' out of place'}</h4><p>${ok ? (decks[di].note || '') : 'Rows in amber are not yet in the right position. Adjust and check again, or show the answer.'}</p></div>`;
  }
  el.onclick = e => {
    const dd = e.target.closest('[data-d]'); if (dd) { di = +dd.dataset.d; load(); return; }
    const mv = e.target.closest('[data-mv]'); if (mv) { move(+mv.closest('li').dataset.p, +mv.dataset.mv); return; }
    const c = e.target.closest('[data-c]'); if (!c) return;
    if (c.dataset.c === 'check') check(); else if (c.dataset.c === 'new') load();
    else { cur = decks[di].steps.map((t, k) => ({ t, k })); checked = true; draw(); $('#ofb', el).innerHTML = `<div class="fb ok"><h4>The correct order</h4><p>${decks[di].note || ''}</p></div>`; }
  };
  el.addEventListener('keydown', e => { const li = e.target.closest && e.target.closest('li[data-p]'); if (li && e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); move(+li.dataset.p, e.key === 'ArrowUp' ? -1 : 1); } });
  el.ondragstart = e => { const li = e.target.closest('li[data-p]'); if (li) { dragI = +li.dataset.p; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragI)); } catch (x) { /* ignore */ } } };
  el.ondragover = e => { if (e.target.closest('li[data-p]')) e.preventDefault(); };
  el.ondrop = e => { const li = e.target.closest('li[data-p]'); if (li && dragI != null) { e.preventDefault(); const to = +li.dataset.p, it = cur.splice(dragI, 1)[0]; cur.splice(to, 0, it); dragI = null; checked = false; draw(); } };
  el.ondragend = () => { dragI = null; $$('li.drag', el).forEach(l => l.classList.remove('drag')); };
  load();
}

/* ---- timed recall ---- */
function gSpeed(el, lesson, back) {
  const cfg = lesson.games.speed, secs = cfg.secs || 60;
  let items, i, score, missed, left, timer = null, running = false;
  function start() { items = shuffle(cfg.items); i = 0; score = 0; missed = []; left = secs; running = true; clearInterval(timer); timer = setInterval(tick, 1000); draw(); }
  function tick() { left--; const t = $('#tm', el); if (t) t.textContent = left + 's'; if (left <= 0) end(); }
  App.cleanup = () => { clearInterval(timer); };
  function draw() {
    if (!running) return;
    if (i >= items.length) return end();
    el.innerHTML = `${back}<h2>Speed recall</h2><div class="row spread"><span class="chip good">${score} correct</span><span class="timer" id="tm">${left}s</span></div>
      <div class="bigcard" style="margin-top:10px">${items[i].d}</div>
      <div class="row" style="margin-top:12px"><input type="text" id="sin" autocomplete="off" aria-label="Type the term" placeholder="Type the term, then press Enter. Press Enter on an empty box to skip." style="flex:1"><button class="btn primary" id="sgo">Enter</button></div><div id="sfb2" class="muted small" style="margin-top:8px" aria-live="polite"></div>`;
    const inp = $('#sin', el); inp.focus();
    const go = () => {
      const v = inp.value.trim(), it = items[i];
      if (!v) { missed.push(it); i++; return draw(); }
      if (acceptsRecall(v, it.a)) { score++; i++; draw(); }
      else { missed.push(it); $('#sfb2', el).innerHTML = `Not quite. The answer was <b>${esc(it.a[0])}</b>.`; inp.disabled = true; setTimeout(() => { if (running && el.isConnected) { i++; draw(); } }, 1100); }
    };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    $('#sgo', el).onclick = go;
  }
  function end() {
    if (!running) return; running = false; clearInterval(timer);
    gameStat('speed', g => { g.plays++; g.best = Math.max(g.best || 0, score); });
    el.innerHTML = `${back}<div class="card"><h3>Time</h3><div class="stat"><div><b>${score}</b>correct in ${secs}s</div><div><b>${missed.length}</b>missed or skipped</div></div>
      ${missed.length ? `<h4>Review these</h4><ul>${missed.map(m => `<li>${m.d} <b>→ ${esc(m.a[0])}</b></li>`).join('')}</ul>` : '<p class="muted">No misses.</p>'}
      <div class="row"><button class="btn primary" id="again">Play again</button><a class="btn" href="#/l1/cards">Flashcards</a></div></div>`;
    $('#again', el).onclick = start;
  }
  start();
}

function ctl(id, label, min, max, step, val, fmt) {
  return `<div class="ctl"><label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o" for="${id}">${fmt ? fmt(val) : val}</output></div>`;

/* ---- process bet lab ---- */
const BetModel = {
  calc({ k, T, L, r }) {
    const N = Math.ceil(T / L - 1e-9), wasteW = k * T / 2, wasteE = k * L / 2;
    const totW = wasteW + r, totE = wasteE + r * N;
    const kStar = T > L ? 2 * r * (N - 1) / (T - L) : Infinity;
    return { N, wasteW, wasteE, totW, totE, kStar };
  },
  wait(t, T, L) { return { w: T - t, e: Math.min(T, (Math.floor(t / L + 1e-9) + 1) * L) - t }; },
};
Widgets.betLab = function (el) {
  const P = {
    stable: { k: 0, T: 24, L: 3, r: 0.3, t: 5, label: 'Known and stable requirements' },
    unknown: { k: 8, T: 24, L: 3, r: 0.3, t: 5, label: 'Unknown needs' },
    regulated: { k: 1, T: 24, L: 6, r: 4, t: 5, label: 'Costly releases (regulated)' },
  };
  let v = Object.assign({}, P.unknown);
  el.innerHTML = `<div class="widget"><div class="wt">Interactive model · the process bet lab <span class="chip warn">illustrative numbers, not course data</span></div>
    <p class="small muted" style="margin-top:0">It encodes two ideas from the lectures: work built between a wrong assumption and the first feedback on it is built on a guess; and every release costs something.</p>
    <div class="row" role="group" aria-label="Presets" style="margin-bottom:6px"><span class="small muted">Presets:</span>${Object.entries(P).map(([id, p]) => `<button class="btn sm" data-p="${id}">${p.label}</button>`).join('')}</div>
    ${ctl('bk', 'Wrong assumptions made during the project', 0, 10, 1, v.k)}
    ${ctl('bT', 'Project length (weeks)', 8, 40, 1, v.T)}
    ${ctl('bL', 'Weeks between feedback (evolutionary)', 1, 8, 1, v.L)}
    ${ctl('br', 'Cost of one release (team-weeks)', 0, 4, 0.1, v.r, x => (+x).toFixed(1))}
    ${ctl('bt', 'Week in which one assumption is made', 1, 24, 1, v.t)}
    <div id="bsvg"></div>
    <div class="stat" id="bstat"></div>
    <p class="small" id="bverdict" style="margin:4px 0"></p>
    <p class="small muted" style="margin:0">Model: average wait for feedback is half the interval, so ${M('\\text{waste} \\approx k\\cdot\\tfrac{\\Delta}{2}', 'waste ≈ k · Δ/2')}; ${M('\\text{total} = \\text{waste} + r\\cdot N_{\\text{releases}}', 'total = waste + r · releases')}. Waterfall: ${M('\\Delta = T,\\; N = 1', 'Δ = T, one release')}. Evolutionary: ${M('\\Delta = L,\\; N = \\lceil T/L \\rceil', 'Δ = L, ⌈T/L⌉ releases')}.</p></div>`;
  function read() { v = { k: +$('#bk', el).value, T: +$('#bT', el).value, L: +$('#bL', el).value, r: +$('#br', el).value, t: +$('#bt', el).value }; }
  function sync() {

    $('#bko', el).textContent = v.k; $('#bTo', el).textContent = v.T; $('#bLo', el).textContent = v.L; $('#bro', el).textContent = v.r.toFixed(1); $('#bto', el).textContent = v.t;
  }
  function draw() {
    sync();
    const c = BetModel.calc(v), w = BetModel.wait(v.t, v.T, v.L);
    const x0 = 120, x1 = 870, X = t => x0 + (x1 - x0) * t / v.T;
    const s = svgStart(900, 215, 'Timeline of feedback points and work built on one wrong assumption, for waterfall and evolutionary processes');
    let g = s.open;
    g += `<text x="8" y="52" class="b">Waterfall</text><text x="8" y="132" class="b">Evolutionary</text>`;
    g += `<line class="ln" x1="${x0}" x2="${x1}" y1="46" y2="46"/><line class="ln" x1="${x0}" x2="${x1}" y1="126" y2="126"/>`;
    g += `<rect x="${X(v.t)}" y="28" width="${Math.max(0, X(v.T) - X(v.t))}" height="36" fill="#fdeaea" stroke="#b42323" stroke-dasharray="4 3"/>`;
    g += `<rect x="${X(v.t)}" y="108" width="${Math.max(0, X(v.t + w.e) - X(v.t))}" height="36" fill="#fdeaea" stroke="#b42323" stroke-dasharray="4 3"/>`;
    g += `<polygon points="${X(v.T)},34 ${X(v.T) + 8},46 ${X(v.T)},58 ${X(v.T) - 8},46" fill="#1f7a36"/>`;
    for (let t = v.L; t <= v.T + 1e-9; t += v.L) g += `<polygon points="${X(Math.min(t, v.T))},114 ${X(Math.min(t, v.T)) + 6},126 ${X(Math.min(t, v.T))},138 ${X(Math.min(t, v.T)) - 6},126" fill="#1f7a36"/>`;
    [46, 126].forEach(cy => { g += `<path d="M${X(v.t) - 6} ${cy - 6} l12 12 M${X(v.t) + 6} ${cy - 6} l-12 12" stroke="#b42323" stroke-width="3" stroke-linecap="round"/>`; });
    g += `<text x="${(X(v.t) + X(v.T)) / 2}" y="80" text-anchor="middle" class="lbl">${w.w} weeks built on the wrong assumption before the customer sees it</text>`;
    g += `<text x="${X(v.t + w.e / 2)}" y="160" text-anchor="middle" class="lbl">${w.e} week${w.e === 1 ? '' : 's'}</text>`;
    for (let t = 0; t <= v.T; t += v.T > 24 ? 8 : 4) g += `<text x="${X(t)}" y="190" text-anchor="middle" class="lbl">${t}</text>`;
    g += `<polygon points="${x0},196 ${x0 + 6},204 ${x0},212 ${x0 - 6},204" fill="#1f7a36"/><text x="${x0 + 12}" y="208" class="lbl">customer sees working software</text><path d="M${x0 + 250} 198 l10 10 M${x0 + 260} 198 l-10 10" stroke="#b42323" stroke-width="3" stroke-linecap="round"/><text x="${x0 + 272}" y="208" class="lbl">wrong assumption made</text><text x="${x1}" y="208" text-anchor="end" class="lbl">weeks</text></svg>`;
    $('#bsvg', el).innerHTML = g;
    const mx = Math.max(c.totW, c.totE, 1);
    const bar = (lab, waste, rel) => `<div style="margin:6px 0"><div class="small">${lab}: <b>${(waste + rel).toFixed(1)}</b> team-weeks <span class="muted">(rework ${waste.toFixed(1)} + releases ${rel.toFixed(1)})</span></div><div style="display:flex;height:16px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:#fff"><i style="width:${100 * waste / mx / 1.0}%;background:#e8590c"></i><i style="width:${100 * rel / mx}%;background:#4263eb"></i></div></div>`;
    $('#bstat', el).innerHTML = `<div style="flex:1;min-width:300px;background:#fff">${bar('Waterfall', c.wasteW, v.r)}${bar('Evolutionary (' + c.N + ' releases)', c.wasteE, v.r * c.N)}<p class="tiny muted" style="margin:2px 0 0"><i class="sw" style="background:#e8590c"></i>rework on wrong assumptions &nbsp; <i class="sw" style="background:#4263eb"></i>release overhead</p></div>`;
    const d = c.totW - c.totE;
    $('#bverdict', el).innerHTML = Math.abs(d) < 0.05 ? '<b>Equal cost here.</b>' : d > 0 ? `<b>Evolutionary is cheaper by ${d.toFixed(1)} team-weeks.</b> The more wrong assumptions, the more feedback frequency matters.` : `<b>Waterfall is cheaper by ${(-d).toFixed(1)} team-weeks.</b> Few wrong assumptions, so rework is small and the extra releases are pure overhead.`;
    $('#bverdict', el).innerHTML += c.kStar !== Infinity ? ` Break-even is at about <b>${c.kStar.toFixed(1)}</b> wrong assumptions.` : '';
  }
  el.oninput = e => { if (e.target.matches('input[type=range]')) { read(); draw(); } };
  el.onclick = e => { const b = e.target.closest('[data-p]'); if (b) { v = Object.assign({}, P[b.dataset.p]); ['k', 'T', 'L', 'r', 't'].forEach(id => { $('#b' + id, el).value = v[id]; }); draw(); } };
  draw();
};

  const STEPS = [
    { h: '1. Red: write the test first', note: 'You say what "done" means before you are invested in one way of getting there. The test fails because next() does not exist yet.', impl: '# todo.py\n# (nothing written yet)', out: 'FAILED test_todo.py::test_next_skips_finished_task\nE   AttributeError: module \'todo\' has no attribute \'next\'', ok: false },
    { h: '2. Green: the simplest code that passes', note: 'Write only enough code to make the test pass.', impl: `# todo.py
_tasks = []
def add(task): _tasks.append(task)
»def next():

»            best = t
»    return best`, out: '1 passed in 0.02s', ok: true },

/* ---- practices as a system ---- */
Widgets.deps = function (el) {
  const D = [
    { f: 'Automated tests', p: 'Refactoring', why: 'Refactoring changes the design without changing behaviour. The tests are the only cheap way to know the behaviour did not change. Without them it is editing and hoping.' },
    { f: 'A shared coding standard', p: 'Collective code ownership', why: 'If anyone may change any file, a shared style keeps the code readable and the diffs meaningful. Without it, ownership becomes people rewriting each other\'s work in their own accent.' },
    { f: 'Estimates checked against actual effort', p: 'The planning game', why: 'A plan is only as good as its estimates. Without comparing estimate with actual, estimates never improve and every iteration is planned on the same wrong numbers.' },
    { f: 'A test suite that runs quickly', p: 'Continuous integration', why: 'Integrating several times a day means running the tests several times a day. If that takes an hour, people stop running them and "tests pass before and after" stops being true.' },
  ];
  const on = D.map(() => true);
  function draw() {
    el.innerHTML = `<div class="widget"><div class="wt">Interactive · practices are a system, not a menu</div>
      <p class="small muted" style="margin-top:0">Switch a foundation off. The practice that relies on it keeps its cost and loses its benefit.</p>
      ${D.map((d, i) => `<div class="dep"><button class="n ${on[i] ? '' : 'off'}" data-i="${i}" aria-pressed="${on[i]}"><small>foundation · ${on[i] ? 'in place' : 'missing'}</small>${d.f}</button><div class="ar">\u2192</div><div class="n ${on[i] ? '' : 'bad'}"><small>${on[i] ? 'works as intended' : 'mostly costs, little benefit'}</small>${d.p}</div></div>${on[i] ? '' : `<div class="callout warn small" style="margin:0 0 6px 0">${d.why}</div>`}`).join('')}
      <div class="callout note small" style="margin:10px 0 0"><b class="t">Also one system</b>Test-first, simple design and refactoring are one practice with three names. Refactoring is safe only because tests say behaviour did not change; simple design is affordable only because refactoring lets you change your mind later; test-first is what gives you the tests. Take one away and the other two stop working.</div></div>`;
  }
  el.onclick = e => { const b = e.target.closest('[data-i]'); if (b) { const i = +b.dataset.i; on[i] = !on[i]; draw(); const nb = $(`[data-i="${i}"]`, el); if (nb) nb.focus(); } };

};
