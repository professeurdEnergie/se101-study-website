/* ---- board with a WIP limit ---- */
const BoardSim = {
  CAP: 3, NEED: 4, N: 9,
  run(limit, ticks) {
    let backlog = Array.from({ length: BoardSim.N }, (_, i) => i + 1), doing = [], done = 0; const series = [0];
    const start = () => { while (backlog.length && (limit == null || doing.length < limit)) doing.push({ id: backlog.shift(), p: 0 }); };
    start();
    for (let t = 1; t <= ticks; t++) {
      if (doing.length) { const share = BoardSim.CAP / doing.length; doing.forEach(c => { c.p += share; }); const fin = doing.filter(c => c.p >= BoardSim.NEED - 1e-9); done += fin.length; doing = doing.filter(c => c.p < BoardSim.NEED - 1e-9); if (limit != null) start(); }
      series.push(done);
    }
    return series;
  },
};
Widgets.board = function (el) {
  let limit = null, backlog, doing, done, tick;
  function reset() { backlog = Array.from({ length: BoardSim.N }, (_, i) => i + 1); doing = []; done = []; tick = 0; msg = ''; draw(); }
  let msg = '';
  function startOne() { if (!backlog.length) return false; if (limit != null && doing.length >= limit) { msg = `WIP limit reached (${limit}). Finish something before starting something new.`; return false; } doing.push({ id: backlog.shift(), p: 0 }); return true; }
  function work(n) {
    for (let k = 0; k < n; k++) {
      tick++;
      if (doing.length) { const share = BoardSim.CAP / doing.length; doing.forEach(c => { c.p += share; }); const fin = doing.filter(c => c.p >= BoardSim.NEED - 1e-9); fin.forEach(c => done.push(c.id)); doing = doing.filter(c => c.p < BoardSim.NEED - 1e-9); if (limit != null) while (backlog.length && doing.length < limit) startOne(); }
    }
  }
  function chart() {
    const a = BoardSim.run(null, 12), b = BoardSim.run(3, 12), w = 420, h = 150, X = t => 36 + t * (w - 50) / 12, Y = n => h - 24 - n * (h - 40) / 9;
    const line = (s, col) => `<polyline fill="none" stroke="${col}" stroke-width="3" points="${s.map((n, t) => `${X(t)},${Y(n)}`).join(' ')}"/>`;
    return `<svg class="dg" viewBox="0 0 ${w} ${h}" style="max-width:${w}px" role="img" aria-label="Cards done over 12 ticks: no limit finishes all nine at tick 12; limit 3 finishes three at tick 4, six at tick 8, nine at tick 12"><line class="ln" x1="36" x2="${w - 14}" y1="${Y(0)}" y2="${Y(0)}"/><line class="ln" x1="36" x2="36" y1="${Y(9)}" y2="${Y(0)}"/>${line(a, '#e8590c')}${line(b, '#2f9e44')}
      ${[0, 4, 8, 12].map(t => `<text x="${X(t)}" y="${h - 8}" text-anchor="middle" class="lbl">${t}</text>`).join('')}<text x="6" y="${Y(9) + 4}" class="lbl">9</text><text x="12" y="${Y(0) + 4}" class="lbl">0</text>
      </svg><div class="tiny" style="margin-top:2px"><i class="sw" style="background:#e8590c"></i>no limit: nine started, none done until tick 12 &nbsp; <i class="sw" style="background:#2f9e44"></i>limit 3: steady flow, 3 done by tick 4, 6 by tick 8</div>`;
  }
  function draw() {
    const cardsHtml = (arr, isDoing) => arr.map(c => isDoing ? `<div class="kc">#${c.id}<i style="width:${Math.min(100, 100 * c.p / BoardSim.NEED)}%"></i></div>` : `<div class="kc">#${c}</div>`).join('');
    el.innerHTML = `<div class="widget"><div class="wt">Interactive model · a board with and without a work-in-progress limit <span class="chip warn">toy model</span></div>
      <p class="small muted" style="margin-top:0">Nine cards, each needing 4 units of work. The team does 3 units per tick, shared equally among the cards in progress.</p>
      <div class="row" style="margin-bottom:8px"><label class="small" for="wip">WIP limit on In progress:</label><select id="wip" style="width:auto"><option value="none" ${limit == null ? 'selected' : ''}>no limit</option><option value="3" ${limit === 3 ? 'selected' : ''}>3 cards</option></select>
        <button class="btn sm" data-a="start">Start next card</button><button class="btn sm" data-a="all">Start as many as allowed</button><button class="btn sm primary" data-a="w1">Work 1 tick</button><button class="btn sm primary" data-a="w4">Work 4 ticks</button><button class="btn sm ghost" data-a="reset">Reset</button></div>
      <div class="board"><div class="col"><h5>Backlog <span>${backlog.length}</span></h5>${cardsHtml(backlog)}</div>
        <div class="col ${limit != null && doing.length >= limit ? 'full' : ''}"><h5>In progress (status::doing) <span>${doing.length}${limit != null ? ' / ' + limit : ''}</span></h5>${cardsHtml(doing, true)}</div>
        <div class="col"><h5>Done <span>${done.length}</span></h5>${cardsHtml(done)}</div></div>
      <p class="small" style="margin:8px 0" aria-live="polite"><b>Tick ${tick}.</b> ${msg || (limit != null ? 'With a limit, finished cards free a slot and the next card is pulled in.' : 'With no limit nothing stops you starting everything.')}</p>
      <div class="muted tiny" style="margin-bottom:4px">Cards done over 12 ticks, both policies (computed with the same rules):</div>${chart()}</div>`;
  }
  el.onchange = e => { if (e.target.id === 'wip') { limit = e.target.value === 'none' ? null : +e.target.value; reset(); } };
  el.onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return; msg = '';
    const a = b.dataset.a;
    if (a === 'start') startOne(); else if (a === 'all') { while (startOne()); if (limit != null) msg = `Started up to the limit (${limit}).`; else msg = 'Everything is now in progress.'; }
    else if (a === 'w1') work(1); else if (a === 'w4') work(4); else if (a === 'reset') { reset(); return; }
    draw();
  };
  reset();
};

/* ---------- predict, then reveal ---------- */
function mountPredict(el, def) {
  const saved = S().pred[def.id];
  const multi = def.kind === 'multi', numeric = def.kind === 'numeric';
  function inputs() {
    if (numeric) return def.fields.map((f, i) => `<div class="field" style="display:inline-block;margin-right:14px"><label class="l" for="pf${i}">${f.label}</label><input type="text" inputmode="decimal" id="pf${i}" data-pf="${i}" style="width:110px" autocomplete="off"></div>`).join('');
    return def.options.map((o, i) => `<label class="opt"><input type="${multi ? 'checkbox' : 'radio'}" name="pr-${def.id}" value="${i}"><span>${o.t}</span></label>`).join('');
  }
  function draw() {
    el.innerHTML = `<div class="predict"><div class="tag">Predict first</div><p style="margin:4px 0 8px"><b>${def.prompt}</b></p>${inputs()}
      <button class="btn primary sm" data-lock="1">Lock in my prediction</button><div class="pr-out" aria-live="polite"></div></div>`;
    renderMath(el);
    if (saved) reveal(true);
  }
  function reveal(fromSaved) {
    let guess, ok;
    if (numeric) {
      const vals = $$('[data-pf]', el).map(i => parseNum(i.value));
      if (!fromSaved && vals.some(isNaN)) { toast('Enter a number in each box to lock in a prediction.'); return; }
      guess = fromSaved ? saved.guess : vals;
      ok = def.fields.every((f, i) => Math.abs((guess[i]) - f.answer) <= (f.tol || 0) + 1e-9);
    } else {
      const picked = fromSaved ? saved.guess : $$(`input[name="pr-${def.id}"]:checked`, el).map(i => +i.value);
      if (!fromSaved && !picked.length) { toast('Pick an option first. A guess is fine.'); return; }
      guess = picked;
      ok = def.options.every((o, i) => !!o.ok === picked.includes(i)) && picked.length > 0;
      if (fromSaved) picked.forEach(i => { const inp = $(`input[name="pr-${def.id}"][value="${i}"]`, el); if (inp) inp.checked = true; });
    }
    if (!fromSaved) { S().pred[def.id] = { guess, ok, ts: Date.now() }; Store.save(); }
    $$('input', el).forEach(i => { i.disabled = true; });
    $('[data-lock]', el).classList.add('hide');
    if (!numeric) $$('label.opt', el).forEach((l, i) => { if (def.options[i].ok) l.classList.add('ok'); else if (guess.includes(i)) l.classList.add('no'); });
    $('.pr-out', el).innerHTML = `<div class="reveal"><b>${ok ? 'Your prediction matched.' : 'Your prediction differed. That is useful: it shows what to look at.'}</b><div style="margin-top:4px">${def.reveal}</div></div>`;
    renderMath(el);
    if (def.after) def.after(ok);
  }
  el.onclick = e => { if (e.target.closest('[data-lock]')) reveal(false); };
  draw();
}

/* ---------- worked examples that fade: full -> partial -> on your own ---------- */
function mountWorked(el, def) {
  let stage = Math.min((S().we[def.id] || {}).stage || 0, 2);
  const filled = {};
  let runner = null;
  function head() {
    const names = ['1. Worked example', '2. Your turn, partly done', '3. On your own'];
    return `<div class="stages">${names.map((n, i) => `<span class="${i === stage ? 'on' : i < stage ? 'done' : ''}">${n}</span>`).join('')}</div>`;
  }
  function draw() {
    if (runner) { runner.destroy(); runner = null; }
    const st = def.stages[stage];
    let body = `<p><b>Problem.</b> ${st.problem}</p>`;
    if (st.type === 'full') {
      body += `<ol class="steps">${st.steps.map(s => `<li><b>${s.h}</b> ${s.t}</li>`).join('')}</ol><button class="btn primary" data-wnext="1">Next: try one yourself</button>`;
    } else if (st.type === 'partial') {
      body += `<ol class="steps">${st.steps.map((s, i) => s.blank ? `<li class="blank"><b>${s.h}</b> ${s.pre || ''} <select data-b="${i}" aria-label="${esc(s.h)}"><option value="">choose…</option>${s.blank.options.map((o, k) => `<option value="${k}">${o}</option>`).join('')}</select> ${s.post || ''}<span class="bres" data-r="${i}"></span></li>` : `<li><b>${s.h}</b> ${s.t}</li>`).join('')}</ol>
        <div class="row"><button class="btn primary" data-chk="1">Check my choices</button><button class="btn" data-reveal="1">Reveal</button><button class="btn good hide" data-wnext="1">Next: on your own</button></div><div id="wmsg" class="small" style="margin-top:8px" aria-live="polite"></div>`;
    } else {
      body += `<div id="wrun"></div>`;
    }
    el.innerHTML = `<div class="card flat" style="border-color:#c5cffa"><h3 style="margin-top:0">${def.title}</h3>${head()}${body}</div>`;
    renderMath(el);
    if (st.type === 'solo') {
      runner = mountRunner($('#wrun', el), { bank: [st.qid], adapt: false, n: 1, requeue: false, doneTitle: 'Worked example complete', summaryEl: true, openEnded: false,
        onDone: () => { S().we[def.id] = { stage: 2, done: true }; Store.save(); Progress.step(def.step || ''); }, doneButtons: def.doneHtml || '' });
    }
  }
  function check(reveal) {
    const st = def.stages[stage]; let ok = 0, tot = 0;
    st.steps.forEach((s, i) => {
      if (!s.blank) return; tot++;
      const sel = $(`[data-b="${i}"]`, el), out = $(`[data-r="${i}"]`, el);
      if (reveal) sel.value = String(s.blank.ans);
      const good = sel.value !== '' && +sel.value === s.blank.ans;
      if (good) ok++;
      out.innerHTML = good ? ` <span class="chip good">✓</span> <span class="small muted">${s.blank.why || ''}</span>` : sel.value === '' ? '' : ` <span class="chip warn">not quite</span> <span class="small muted">${s.blank.hint || 'Re-read the earlier steps.'}</span>`;
      sel.disabled = good || reveal;
    });
    $('#wmsg', el).textContent = ok === tot ? 'All steps complete.' : `${ok} of ${tot} correct. Adjust the others, or reveal.`;
    if (ok === tot) $('[data-wnext]', el).classList.remove('hide');
  }
  el.onclick = e => {
    if (e.target.closest('[data-chk]')) check(false);
    else if (e.target.closest('[data-reveal]')) check(true);
    else if (e.target.closest('[data-wnext]')) { stage = Math.min(2, stage + 1); S().we[def.id] = { stage }; Store.save(); draw(); }
  };
  draw();
}

/* ---------- Lesson 1 glossary (definitions follow the lecture slides) ---------- */
(function () {
  const G = (id, term, def) => { GLOSS[id] = { term, def, lesson: 'l1', first: null }; };
  G('process', 'process', 'A description of how something gets done, or a prescription for how to do it. Everyone follows a process for almost everything; engineering is <i>intentional</i> about it.');
  G('engineering-process', 'engineering process', 'In this course, a process whose steps are justified by evidence or established practice, and which is improved from its own results. Being written down in detail, or using the latest tools, is not enough.');
  G('software-engineering', 'software engineering', 'A systematic, disciplined process to build software that is functional, efficient, safe, dependable, maintainable and so on, and to build the tools and processes that enable and improve that process.');
  G('engineering', 'engineering', 'Defined differently by three bodies. ABET: scientific knowledge applied <i>with judgment</i> for the benefit of mankind. Engineers Canada: acts that require engineering principles and concern <i>the safeguarding of life, health, property, economic interests, public welfare or the environment</i>. CEAB: engineering design is <i>making informed decisions</i> to meet specified goals, based on analysis and judgment.');
  G('judgment', 'judgment', 'The informed decision-making that ABET and CEAB name as part of engineering. Engineering design is not about a single correct answer.');
  G('accountability', 'accountability', 'Being answerable for a decision and its consequences. The course treats the engineer as accountable for what they decide, approve and ship.');
  G('requirement', 'requirement', 'Something the product must do, or a quality it must have, stated so that somebody else can check whether it was met. (The Requirements lesson covers this in depth.)');
  G('process-model', 'process model', 'Describes the activities of building and operating software, and their ordering. Also called a life-cycle model or SDLC; this course says <i>process model</i>.');
  G('maintenance', 'maintenance', 'Changing software that already exists and is in use. In Lab 1 you were handed working-ish code written by somebody else and had to understand it before changing it. Most software work is maintenance.');
  G('waterfall', 'waterfall model', 'A process model of sequential phases, each signed off before the next begins, with feedback only to the phase immediately before. It is documentation-driven: each phase\'s output is a document the next phase consumes.');
  G('sign-off', 'signed off', 'Formally approved as complete. In waterfall, each phase is signed off before the next phase begins.');
  G('plan-driven', 'plan-driven', 'The course\'s name for waterfall-like processes: the plan and its documents are fixed up front and followed. It bets that the requirements are stable.');
  G('bet', 'bet', 'The assumption about the requirements that a process model relies on. Waterfall bets that they are stable; evolutionary bets that they are not. The question is never which model is best, but which bet the project lets you make.');
  G('evolutionary', 'evolutionary model', 'A process model that builds a series of versions. Each version is a complete, working, small system; new versions implement new and evolved requirements, including ones discovered by watching someone use the last version.');
  G('build-and-fix', 'build-and-fix', 'What evolutionary development decays into without discipline: changes piled on without design or verification.');
  G('feedback-loop', 'feedback loop', 'A cycle in which the result of what you did is observed and used to correct the next step. Estimation without it gives "opinions that never get corrected".');
  G('agile', 'agile', 'A family of evolutionary processes with named practices that stop evolution decaying into build-and-fix.');
  G('agile-manifesto', 'Agile Manifesto', 'A 2001 statement of four value pairs: individuals and interactions over processes and tools; working software over comprehensive documentation; customer collaboration over contract negotiation; responding to change over following a plan. "While there is value in the items on the right, we value the items on the left more."');
  G('xp', 'Extreme Programming (XP)', 'An evolutionary, agile process with named practices and a bias toward working code over documents. Designed for small teams. Scrum and Kanban answer different questions; XP is the one that tells you how to write code.');
  G('iteration', 'iteration', 'One planned pass of building and reviewing in an agile process, typically one to three weeks.');
  G('release', 'release', 'A version of the product that somebody can use. In XP releases are small and frequent; a release is not a milestone in a plan.');
  G('small-releases', 'small releases', 'Start with the smallest useful feature set, release early and often, and add a few features each time.');
  G('on-site-customer', 'on-site customer', 'Continuous access to a real user, not a document about one, so that "is this what you meant?" costs a minute rather than a change request.');
  G('planning-game', 'planning game', 'An XP meeting with a division of authority: business people decide value (what is worth building, in what order); developers decide cost (technical risk, effort). Neither overrules the other on the other\'s half.');
  G('estimation', 'estimation', 'Estimating each item\'s effort at the start of an iteration, recording what it actually took at the end, and using the difference to estimate better next time. Without the second step there is no feedback loop.');
  G('user-story', 'user story', 'A short statement of something a user wants; usually the unit that is valued and estimated in planning. (The Requirements lesson covers the format.)');
  G('continuous-integration', 'continuous integration (CI)', 'In this course, a <i>practice</i>, not a tool: every change goes into the shared code base at least daily, and the tests pass before and after. A build server only tells you the integration broke; the practice is integrating often enough that there is little to break.');
  G('branch', 'branch', 'An independent line of work in version control. (The Git lesson gives the exact model.)');
  G('merge', 'merge', 'Combining the changes from one line of work into another.');
  G('main', 'main', 'The shared branch where the team\'s integrated work lives.');
  G('stand-up', 'daily stand-up', 'Fifteen minutes, same time every day, standing up so that it stays fifteen minutes. Each person answers: what have I done since the last one, what is in my way, what am I doing next. Scrum calls it the daily scrum.');
  G('impediment', 'impediment', 'Something in somebody\'s way. The stand-up\'s job is to surface it early and have somebody take it up.');
  G('board', 'board', 'A visual display with one card per issue and one column per state, so that anyone sees in two seconds what the team is doing, and what nobody is doing.');
  G('issue', 'issue', 'In GitLab, a tracked item of work or a problem. Each card on the board is an issue.');
  G('scoped-label', 'scoped label', 'A GitLab label of the form <code>family::value</code>, such as <code>status::doing</code>. Labels in one scoped family are mutually exclusive, so an issue is in exactly one column.');
  G('wip-limit', 'work-in-progress (WIP) limit', 'A cap on how many cards may sit in the In progress column. Starting is easy; finishing is the work.');
  G('test-first', 'test-first', 'Write the test, watch it fail, then write the code that makes it pass. It makes you say what "done" means before you are invested in one way of getting there.');
  G('unit-test', 'unit test', 'A test that exercises an individual module. Programmers write them. It answers: does this piece do what I think it does?');
  G('acceptance-test', 'acceptance test', 'A test that exercises the system as a user meets it, and comes from the customer. It answers: is this the thing that was wanted? Unit and acceptance tests are not substitutes.');
  G('simple-design', 'simple design', 'The simplest design that passes the tests and states your intent.');
  G('speculative-genericity', 'speculative genericity', 'Machinery built for a requirement nobody has asked for. It is usually the wrong flexibility, paid for now.');
  G('refactoring', 'refactoring', 'Improving the design without changing behaviour, continuously and in small steps, not as a project scheduled for later.');
  G('pair-programming', 'pair programming', 'All production code written by two programmers at one machine: one thinks about the method being written, the other about the system it is landing in. Pairs form dynamically.');
  G('collective-ownership', 'collective code ownership', 'Anyone who sees a way to improve any part of the code is expected to do it, then and there. There is no "that is Priya\'s file".');
  G('coding-standard', 'coding standard', 'Conventions everyone writes to, so that you cannot tell from the code who wrote it.');
  G('bus-factor', 'bus factor of one', 'A module that only one person understands. It becomes the module nobody dares change, then the reason the project cannot move.');
  G('sustainable-pace', 'sustainable pace (40-hour week)', 'Programmers go home on time. Overtime is a symptom of a problem, not a solution to one. It is a measurement, not a kindness.');
  G('certification', 'certify', 'To approve, as a regulator does, that a product meets documented requirements, with evidence that each one was tested.');
})();

        html: `<p>The {{evolutionary}} makes the opposite bet: that the requirements are <i>not</i> stable, and that the cheapest way to find them is to build something small and look at it. It builds a series of versions. <b>Each version is a complete, working, small system.</b> New versions implement new and evolved requirements, including the ones you only discovered by watching someone use the last version.</p>
<div data-w="evolutionary"></div>
<p>So, besides the code, what is expected to change from version to version is <b>the requirements</b>. Waterfall treats them as fixed once its first phase is done.</p>
<div class="callout warn"><b class="t">The cost</b>Without discipline it decays into {{build-and-fix}}: changes piled on without design or verification. The discipline is what the rest of the course is about.</div>` },
      { id: 'c3s2', title: 'Why feedback frequency matters', core: true, key: 'Both processes can build the wrong thing. They differ in how long the mistake survives.',
        html: `<p>In waterfall the customer first sees working software near the end, so a wrong assumption made in week 1 stays in the product, with everything built on top of it, until then. In an evolutionary process each version goes in front of users, so the same mistake is found at the next release. That is the {{feedback-loop|feedback loop}} the evolutionary model buys.</p>
<div data-pred="p-bet"></div>
<div data-w="betLab"></div>
<p>Read the model in both directions. With many wrong assumptions, a short feedback interval wins by a wide margin. With none, the extra releases are pure overhead and waterfall wins. That is the course's "bet" idea expressed in numbers.</p>` },
      { id: 'c3s3', title: 'Agile, and what the manifesto really says', core: true, key: 'Agile is a preference under uncertainty, not a licence to skip the right-hand column.',
        html: `<p>{{agile}} is a family of evolutionary processes with named practices that stop evolution decaying into build-and-fix. It starts from the 2001 {{agile-manifesto|Agile Manifesto}}:</p>
<div data-w="manifesto"></div>
<p>A team that says "we're agile, so we don't write documentation and we don't plan" has missed the last sentence. Agile teams still keep written artifacts, each with a reader who needs it:</p>
<ul><li><b>Automated tests:</b> the team and the next maintainer; an executable specification that catches regressions.</li><li><b>User stories and use cases kept in the repository:</b> anyone building or testing the feature, and the AI tools that read the repository.</li><li><b>Issues and merge-request descriptions:</b> who asked for what and who agreed.</li><li><b>A test plan and test report:</b> whoever decides on release; what was and was not tested.</li></ul>
<p>{{xp|Extreme Programming (XP)}} is the agile process the course uses to name practices: evolutionary development, a bias toward working code over documents, designed for small teams. Half of its practices are already course requirements.</p>` },
      { id: 'c3s4', title: 'Choosing the bet: a worked example that fades', core: true, key: 'Name the bet, check it against what is known about the requirements, then choose.',
        html: `<p>Choosing a process is a short argument: what do we know about the requirements, which bet does that allow, and what would change our mind? Study the full example, complete the second, then try the third alone.</p>
<div data-we="we-bet"></div>` },
    ],
  },
  {
    id: 'c4', short: 'Practices as a system', title: 'Agile practices as a system', objs: ['O5'], minutes: 9,
    quiz: { bank: ['q507', 'q501', 'q502', 'q505', 'q506', 'q503', 'q504', 'q508'], n: 3 },
    sections: [
      { id: 'c4s1', title: 'Loops inside loops', core: true, key: 'Every loop ends in something that works and feeds the loop outside it. Miss one and the loops outside it run on guesses.',
        html: `<p>Agile practice is not a list. It is loops inside loops: a <b>release</b> every few weeks, containing <b>iterations</b> of one to three weeks, each made of <b>days</b>, each made of <b>minutes</b> of writing and checking code. The minutes loop keeps the code honest, the day loop keeps the team together, the iteration loop keeps the plan honest, and the release loop keeps the product honest.</p>
<div data-w="loops"></div>
<p>The {{release}} loop uses {{small-releases}} and an {{on-site-customer}}. The {{iteration}} loop uses the planning game and estimation (next section). Each practice exists because of a specific failure: name the failure and you can judge whether the practice is worth it.</p>` },
      { id: 'c4s2', title: 'The planning game, estimation and the 40-hour week', core: true, key: 'Business decides value, developers decide cost. Estimates only improve if you compare them with actuals.',
        html: `<p>In the {{planning-game}} the authority is divided, and the division is the whole point.</p>
<div data-w="planning"></div>
<p>{{estimation|Estimation}} closes the loop, and it is the part teams skip: estimate each item's effort at the start of the iteration, record what it actually took at the end, and use the difference to estimate better next time. Without the second step there is no loop, only opinions that never get corrected. The unit being valued and estimated is usually a {{user-story}}.</p>
<p><b>Why the 40-hour week is a measurement, not a kindness.</b> A team working late is telling you the estimate was wrong, or the scope grew, or something is blocked, which is information the planning game needs. Absorbing it with unpaid hours destroys the signal, and the next iteration is planned on the same bad numbers. Overtime is a {{sustainable-pace|symptom of a problem}}, not a solution to one.</p>` },
      { id: 'c4s3', title: 'The minutes loop: test-first, simple design, refactoring', core: true, key: 'Test-first gives you the tests; the tests make refactoring safe; refactoring makes simple design affordable.',
        html: `<p>{{test-first}}: write the test, watch it fail, then write the code that makes it pass. {{simple-design}}: the simplest design that passes the tests and states your intent, with no {{speculative-genericity}}. {{refactoring}}: improving the design without changing behaviour, in small steps. Step through one cycle on a To-Do function:</p>
<div data-w="redGreen"></div>
<p><b>Who writes which tests?</b> {{unit-test|Unit tests}} exercise individual modules and programmers write them: <i>does this piece do what I think it does?</i> {{acceptance-test|Acceptance tests}} exercise the system as a user meets it and come from the customer: <i>is this the thing that was wanted?</i> They are not substitutes: a system with perfect unit tests can be entirely the wrong system, and that failure is invisible from the inside.</p>` },
      { id: 'c4s4', title: 'A system, not a menu', core: true, key: 'Adopt one practice alone and you mostly get its costs.',
        html: `<div data-pred="p-sys"></div>
<div data-w="deps"></div>` },
      { id: 'c4s5', title: 'Pairing, shared ownership and standards', core: false, key: 'Pairing and rotation both exist so that no line has been seen by exactly one person.',
        html: `<ul><li><b>{{pair-programming|Pair programming}}.</b> Two programmers at one machine. The objection is "two people, one program: half the output." Measured, a pair writes somewhat less code somewhat more slowly, with fewer defects, and a defect caught while typing costs a fraction of the same defect caught in review, in testing, or by a user. In SE 101, Lab 5 separates the roles instead: one member implements, a second writes tests, a third reviews, and you rotate.</li>
<li><b>{{collective-ownership|Collective code ownership}}.</b> Anyone who sees a way to improve any part of the code does it, then and there. Collective ownership without a {{coding-standard|shared style}} is a licence to rewrite each other's work in your own accent, and it makes every diff unreadable.</li>
<li><b>{{bus-factor|Bus factor of one}}.</b> The module only one person understands becomes the module nobody dares change, and then the reason the project cannot move.</li></ul>` },
    ],
  },
  {
    id: 'c5', short: 'Integration, stand-up, board', title: 'Staying integrated and visible', objs: ['O6'], minutes: 8,
    quiz: { bank: ['q601', 'q609', 'q608', 'q603', 'q602', 'q604', 'q605', 'q607', 'q606'], n: 3 },
    sections: [
      { id: 'c5s1', title: 'Integrate at least daily', core: true, key: 'Merge cost grows with everything that happened meanwhile, not with the size of your own change.',
        html: `<p>{{continuous-integration|Continuous integration}} in this course is a <b>practice, not a tool</b>: every change goes into the shared code base at least daily, and the tests pass before and after. It is not a build server. A build server tells you the integration broke; the practice is integrating often enough that there is little to break.</p>
<p>Why daily, and not "when the feature is finished"? A {{branch}} that has not been integrated for a week is a {{merge}} you have not paid for yet, growing while four other people edit the same files. The cost of merging does not rise with the size of your change. It rises with the size of everything that happened meanwhile on {{main}}.</p>
<div data-pred="p-merge"></div>
<div data-w="mergeCost"></div>
<div class="callout warn"><b class="t">"GitLab reported no conflicts, so it is integrated and correct"</b>Not enough. Git compares text, so a merge with no conflicts can still be wrong (a function renamed on one side and called by its old name on the other). And GitLab checks a merge request only against the target branch as it is now, never against your other open merge requests. "Integrated" means merged <i>and</i> the tests are green.</div>` },
      { id: 'c5s2', title: 'The daily stand-up', core: true, key: 'The one output that justifies a stand-up is an impediment, raised early and taken up.',
        html: `<p>The {{stand-up}} exists to surface what is in somebody's way (an {{impediment}}) while it is cheap to deal with.</p>
<div data-w="standup"></div>` },
      { id: 'c5s3', title: 'The board: making work visible', core: true, key: 'Cap the In progress column. Starting is easy; finishing is the work.',
        html: `<p>A {{board}} has one card per {{issue}} and one column per state. In two seconds anyone sees what the team is doing, and what nobody is doing. In GitLab you already have every piece:</p>
<ul><li>The <b>cards are your issues</b>. Nothing new to create.</li><li>The <b>columns are labels</b>: one family of {{scoped-label|scoped labels}} such as <code>status::backlog</code>, <code>status::doing</code>, <code>status::review</code>, <code>status::done</code>. Scoped labels are mutually exclusive, so an issue is in exactly one column.</li><li>Dragging a card relabels the issue, so the board is <b>a view of the issues, not a second place to keep the truth</b>.</li><li>"Assigned" is the assignee field, not a column.</li></ul>
<p>The rule that makes it more than a to-do list: put a {{wip-limit|limit}} on the In progress column. A team with nine things started and none finished has produced nothing.</p>
<div data-pred="p-wip"></div>
<div data-w="board"></div>
<p>The board's real job is to make "stuck" visible without anyone having to admit it. A card that has not moved in a week says the same as the branch nobody merged and the impediment nobody mentioned. And a board that was set up once and then ignored is worse than none: it is a second, stale record, and a reviewer reading it sees a fiction.</p>` },
      { id: 'c5s4', title: 'Diagnose it: a second worked example', core: false, key: 'Diagnosis, fix, and the output that tells you the fix worked.',
        html: `<div data-we="we-meet"></div>` },
      { id: 'c5s5', title: 'Where you meet each practice in SE 101', core: false, key: 'Half of this deck is already a course requirement. That was not an accident.',
        html: `<table class="t"><tr><th>Practice</th><th>Where you meet it</th></tr>
<tr><td>Test-first</td><td>Lab 2</td></tr><tr><td>Testing, and testing the tests</td><td>Lab 4</td></tr><tr><td>Continuous integration</td><td>Every lab: merges into the application branch</td></tr><tr><td>Small releases</td><td>Lab 2's three units, merged separately</td></tr><tr><td>Simple design</td><td>Marked in every lab: the fix confined to what was wrong</td></tr><tr><td>Role rotation (for pairing)</td><td>Lab 5</td></tr><tr><td>Collective ownership, coding standards</td><td>The project</td></tr><tr><td>Planning game, estimation</td><td>The project, from Lab 5 on</td></tr><tr><td>Stand-up and a board</td><td>Your team, from Lab 5 (not marked)</td></tr><tr><td>On-site customer</td><td>The three review rounds</td></tr></table>` },
    ],
  },
];

/* ---------- Lesson 1 question bank, part A: objectives O1 to O3 ---------- */
const Q = o => { o.lesson = 'l1'; QBANK[o.id] = o; return o; };
const pt = (label, any, why, nudge, extra) => Object.assign({ label, any, why, nudge }, extra || {});
const MC = (t, ok, why) => ({ t, ok, why });

/* ===== O1: process, process model, engineering process ===== */
Q({ id: 'q101', type: 'mcq', obj: 'O1', diff: 1, prompt: 'Which statement best describes a <b>process</b> as the course uses the word?',
  hint: 'The lecture gives two phrasings: how something gets done, and how to do it.',
  options: [
    MC('A description of how something gets done, or a prescription for how to do it', true, 'Correct. Everyone follows a process for almost everything; engineering is intentional about it.'),
    MC('The set of tools that automate the work', false, 'Misconception: process = tools. Tools can be part of a process, but "it uses the latest tools" is not what makes a process an engineering process.'),
    MC('A document signed by a manager', false, 'Misconception: process = paperwork. A document may describe a process; it is not the process.'),
    MC('A schedule of dates for each task', false, 'Misconception: process = schedule. A schedule says when; a process says how and in what order.'),
  ] });

Q({ id: 'q102', type: 'mcq', obj: 'O1', diff: 2, simpler: 'q101',
  prompt: 'Team X follows a 12-page procedure exactly, every time, but has never checked whether it works. Team Y has a shorter procedure; it can say why each step exists, and it changed one step after measuring its results. Which team follows an <b>engineering process</b>?',
  hint: 'Look for justification by evidence and improvement from results.',
  options: [
    MC('Team X, because the procedure is written in detail and followed exactly', false, 'Misconception: engineering = rigid conformance. Following a procedure exactly says nothing about whether the steps are justified or ever improved.'),
    MC('Team Y, because its steps are justified and it improves the process from its own results', true, 'Correct. This is the course\'s criterion: justified by evidence or established practice, and improved from its own results.'),
    MC('Team X, because a longer procedure is more rigorous', false, 'Misconception: length = rigour. Detail is not evidence.'),
    MC('Neither, because only licensed engineers can have an engineering process', false, 'Misconception: licence = process. A licence concerns who may practise, not whether a process is justified and improved.'),
  ] });

Q({ id: 'q103', type: 'written', obj: 'O1', diff: 2, simpler: 'q101',
  prompt: 'In your own words: what is a <b>process model</b>, and what differs from one process model to another?',
  hint: 'Two parts: what it describes, and which of its ingredients varies.',
  rubric: [
    pt('It describes the <b>activities</b> of building (and operating) software', [/\bactivit\w*\b/, /\b(requirements?|design|implementation|testing|maintenance)\b.*\b(requirements?|design|implementation|testing|maintenance)\b/], 'A process model is a description of the activities, such as requirements, design, implementation, testing and maintenance.', 'Say what a process model describes.'),
    pt('...and their <b>ordering</b>', [/\border(ing|ed|s)?\b/, /\bsequenc\w*\b/, /\barrang\w*\b/], 'The ordering is part of the definition: it is what the model decides.', 'The definition has a second ingredient besides the activities.'),
    pt('What differs between models is the <b>ordering and how often you go round</b>; the activities are roughly the same', [/\b(differ\w*|vary|varies|different|change\w*)\b.*\b(order\w*|how often|repeat\w*|iterat\w*|loop\w*|cycl\w*|go(es)? round|sequenc\w*)\b/, /\b(order\w*|how often|repeat\w*|iterat\w*|go(es)? round)\b.*\b(differ\w*|vary|varies|different)\b/, /\bsame activities\b/, /\bactivities (are )?(roughly |about |mostly )?the same\b/], 'The activities barely change between models. The ordering, and how many times you go round, is the design decision.', 'Say which part varies between models.'),
  ],
  model: 'A process model describes the activities of building and operating software (requirements, design, implementation, testing, maintenance, retirement) and their ordering. The activities are roughly the same in every model; what differs between models is the ordering and how often you go round.' });

Q({ id: 'q104', type: 'written', obj: 'O1', diff: 3, exam: true, simpler: 'q102',
  prompt: 'A fluent answer to "What is engineering?" reads: <i>"Engineering is the application of scientific knowledge to build useful things efficiently."</i> Using the three definitions from the lecture, name <b>two things it leaves out</b>, and explain why an answer like this is hard to criticise.',
  hint: 'ABET\'s word, Engineers Canada\'s clause, and a property of the person who decides. Then ask: is the answer wrong?',
  rubric: [
    pt('Names two omissions from: <b>judgment</b> (informed decisions); <b>safeguarding</b> life, health, public welfare; <b>accountability</b> of the engineer', null, 'The three omissions in the course: judgment (ABET, CEAB), safeguarding life, health and public welfare (Engineers Canada), and accountability for the decision.', 'Name two things the three definitions contain that this answer does not.', {
      of: [[/\bjudg?e?ment\b/, /\binformed decisions?\b/], [/\bsafeguard\w*\b/, /\bpublic (welfare|safety|interest|good)\b/, /\b(life|health)\b.*\b(property|welfare|public|safety|protect\w*)\b/, /\bprotect\w* (the )?public\b/, /\bsafety of (the )?public\b/], [/\baccountab\w*\b/, /\bresponsib\w*\b/, /\bliab\w*\b/, /\banswerable\b/]], min: 2, w: 2 }),
    pt('It is <b>not wrong</b>; it is fluent and unobjectionable', [/\bnot wrong\b/, /\bunobjectionable\b/, /\bfluent\b/, /\bplausible\b/, /\bsounds? (right|good|correct|reasonable|fine)\b/, /\bseems? (right|fine|correct|reasonable)\b/, /\bincomplete\b/, /\bnothing (is )?wrong\b/, /\bnot incorrect\b/, /\bcorrect as far as\b/], 'Nothing in it is false, so there is nothing to object to; the problem is what is absent.', 'Say whether the answer contains anything false.'),
    pt('You only notice an <b>absence</b> if you already know what belonged there', [/\balready know\w*\b/, /\b(know|knowledge)\b.*\b(missing|absen\w*|belong\w*|left out|omitted|should)\b/, /\b(missing|absen\w*|left out|omitted)\b.*\b(know|knowledge|unless|only if)\b/, /\bhard to (notice|spot|see)\b/, /\bwithout (prior |the )?(knowledge|background)\b/, /\bunless you\b/], 'Absences do not show up as errors; spotting one needs the knowledge of what should be there. That is why the quizzes are closed book.', 'Why can a reader not simply see what is missing?'),
  ], passAt: 0.75,
  model: 'It leaves out judgment (ABET\'s word; CEAB\'s "informed decisions") and the safeguarding of life, health and public welfare (Engineers Canada\'s clause, the reason engineering is regulated); it also says nothing about the engineer being accountable for the decision. It is hard to criticise because it is not wrong, only fluent and unobjectionable, and you can only notice an absence if you already know what belonged there.' });

Q({ id: 'q105', type: 'tf', obj: 'O1', diff: 2, simpler: 'q102', answer: false,
  prompt: '<b>True or false?</b> A process is an engineering process as soon as it is written down in detail and followed exactly. Give the reason.',
  hint: 'Could a detailed, exactly-followed procedure still be unjustified?',
  wrong: 'The statement is false. A procedure can be written down in detail and followed exactly and still be unjustified, never checked against anything, and never improved.',
  rubric: [
    pt('Steps must be <b>justified</b> by evidence or established practice', [/\bjustif\w*\b/, /\bevidence\b/, /\bestablished practice\b/, /\brationale\b/, /\bgrounded\b/], 'The course criterion: each step is justified by evidence or established practice, not by habit.', 'What must be true of each step, beyond being written down?'),
    pt('...and the process is <b>improved from its own results</b>', [/\bimprov\w*\b/, /\b(from|based on|using) (its )?(own )?results\b/, /\bmeasur\w*\b/, /\bfeedback\b/, /\bretrospective\b/, /\bevaluat\w*\b/, /\bchecked? (against|whether)\b/, /\badjust\w*\b/], 'An engineering process produces evidence and changes when the evidence shows it is not working.', 'What happens to the process over time?'),
  ], passAt: 0.5,
  model: 'False. Writing a process down and following it exactly does not make it engineering. Its steps must be justified by evidence or established practice, and it must be improved from its own results.' });

/* ===== O2: waterfall and its risk ===== */
Q({ id: 'q201', type: 'mcq', obj: 'O2', diff: 1,
  prompt: 'In the waterfall model, where does feedback go when a problem is found in a phase?',
  hint: 'Look at the dashed arrows in the diagram.',
  options: [
    MC('Directly to any earlier phase', false, 'Misconception: free feedback. In waterfall, feedback goes only to the phase immediately before.'),
    MC('Only to the phase immediately before', true, 'Correct. Phases are signed off one at a time, and feedback is limited to the previous phase.'),
    MC('There is no feedback of any kind', false, 'Misconception: waterfall has no feedback. It has a little, but only to the adjacent phase, which is part of its weakness.'),
    MC('To the customer, who rewrites the requirements', false, 'Misconception: ongoing customer involvement. In waterfall the customer appears in phase one and then vanishes.'),
  ] });

Q({ id: 'q202', type: 'written', obj: 'O2', diff: 1, simpler: 'q201',
  prompt: 'When does the customer normally <b>first see working software</b> in the waterfall model, and why is that a risk?',
  hint: 'Which phases must finish before anything can run?',
  rubric: [
    pt('Near the <b>end</b>, after implementation and testing', [/\b(end|late|last|final|very late)\b/, /\bafter (the )?(implementation|testing|coding|everything|all (the )?(phases|work))\b/, /\bnear the end\b/], 'Nothing runs until very late: the customer sees working software only after the later phases.', 'State when the customer sees it.'),
    pt('Risk: a misunderstanding is found when it is <b>most expensive to fix</b> (the wrong system is built)', [/\bwrong (system|product|thing|software)\b/, /\bmisunderstand\w*\b/, /\bexpensive\b/, /\bcostl\w*\b/, /\b(hard|harder|difficult)\b.*\b(fix|change|correct)\w*\b/, /\brequirements (have |has )?(moved|changed)\b/, /\btoo late\b/], 'A misunderstanding of what was wanted is only discovered at the end, when the most has been built on it.', 'Say what can go wrong if it is first seen then.'),
  ],
  model: 'Near the end, after implementation and testing. The risk is building the wrong system: a misunderstanding of what was wanted is discovered when it is most expensive to fix.' });

Q({ id: 'q203', type: 'written', obj: 'O2', diff: 2, simpler: 'q201',
  prompt: 'State the <b>central problem</b> of the waterfall model, and name <b>one thing it buys</b>.',
  hint: 'The central problem is an assumption about what you know before you start.',
  rubric: [
    pt('It <b>assumes you know what to build</b> before you start (a complete, frozen specification up front)', [/\bknow\w* what to build\b/, /\b(requirements?|spec\w*) (are |is |must be |to be )?(known|fixed|frozen|complete|stable|unchanging|settled)\b/, /\bfrozen\b/, /\bassum\w*\b.*\b(know|stable|fixed|known|complete|unchang\w*)\b/, /\bup ?front\b/, /\bbefore (you |we |they )?start\b/, /\bcomplete (specification|requirements)\b/], 'For anything new you do not know what to build up front; waterfall assumes you do.', 'What does waterfall assume about the requirements at the start?'),
    pt('It buys <b>documentation</b>, easier <b>maintenance</b>, or progress <b>legible to managers</b>', [/\bdocument\w*\b/, /\bmaintenance\b.*\beasier\b/, /\beasier\b.*\bmaintain\w*\b/, /\bmaintainab\w*\b/, /\bprogress\b.*\b(legible|visible|clear|track\w*|measur\w*|see)\b/, /\blegible\b/, /\bmanagers?\b/], 'The three things waterfall buys: documentation exists, maintenance is easier, progress is legible to managers.', 'Name one benefit.'),
  ],
  model: 'Central problem: it assumes you know what to build before you start, with a complete, frozen specification up front, which is rarely possible for anything new. It buys documentation, easier maintenance, or progress that is legible to managers.' });

Q({ id: 'q204', type: 'tf', obj: 'O2', diff: 2, simpler: 'q201', answer: false,
  prompt: '<b>True or false?</b> Waterfall is outdated, so choosing it for a project today is always a mistake. Give the reason.',
  hint: 'Think of the course\'s word for a process model, and of projects where the requirements really are known.',
  wrong: 'The statement is false. Waterfall is not a mistake; it is a bet that the requirements are stable, and sometimes the bet is right.',
  rubric: [
    pt('It is a <b>bet</b> that requirements are <b>stable</b>; right when they are known', [/\bbet\b/, /\bstable\b/, /\bknown\b/, /\bunchang\w*\b/, /\bfixed\b/, /\bwill not change\b/, /\bwon'?t change\b/, /\bwell[- ]?defined\b/], 'Waterfall is efficient and its documents are worth having exactly when the requirements are stable.', 'What assumption does waterfall make, and when is it true?'),
    pt('...or names where it still fits: <b>regulated or safety-critical</b> work, or small known requirements', [/\bregulat\w*\b/, /\bsafety\b/, /\bcertif\w*\b/, /\blab 1\b/, /\bcritical\b/], 'Safety-critical and regulated work still runs this way, for good reasons.', 'Where is it still used?', { w: 1 }),
  ], passAt: 0.5,
  model: 'False. Waterfall is a bet that the requirements are stable. When that bet is right (known, written-down requirements; safety-critical and regulated work) the sequential order is efficient and the documents are worth having.' });

Q({ id: 'q205', type: 'numeric', obj: 'O2', diff: 2, simpler: 'q202',
  prompt: 'A project lasts <b>20 weeks</b>. In a waterfall process the customer sees working software once, at the end. In an evolutionary process the team releases every <b>4 weeks</b>. A misunderstanding is built into the product in <b>week 1</b>. At the end of which week does the customer first see it?',
  hint: 'Find the first release that comes after week 1.',
  fields: [{ label: 'Waterfall: end of week', answer: 20 }, { label: 'Evolutionary: end of week', answer: 4 }],
  explain: 'Waterfall has one release, at week 20. The evolutionary project releases at weeks 4, 8, 12, 16 and 20, so the first release after week 1 is week 4. The same mistake survives five times longer in the waterfall project.' });

Q({ id: 'q206', type: 'written', obj: 'O2', diff: 3, exam: true, simpler: 'q202',
  prompt: 'State the <b>main risk</b> of a process in which the customer sees working software only near the end, and explain how an <b>evolutionary</b> process reduces it.',
  hint: 'Risk: what is built and when the mistake is found. Remedy: how often something working reaches the customer.',
  rubric: [

Q({ id: 'q304', type: 'written', obj: 'O3', diff: 3, exam: true, simpler: 'q302',
  prompt: 'A classmate says: "Always use agile. Waterfall is obsolete." Reply, using the idea that a process model is a <b>bet about the requirements</b>.',

    pt('<b>Waterfall</b> is right when requirements are <b>stable or known</b> (or work is regulated)', [/\b(waterfall|plan[- ]driven)\b.*\b(stable|known|fixed|unchang\w*|well[- ]defined|regulat\w*|safety|certif\w*|right|appropriate|fine|works?)\b/, /\b(stable|known|fixed|unchang\w*|regulat\w*|safety[- ]critical)\b.*\b(waterfall|plan[- ]driven)\b/], 'When requirements are stable, one pass is efficient and the documents are worth having.', 'When would waterfall be the right bet?'),
    pt('<b>Evolutionary or agile</b> is right when requirements are <b>unknown or changing</b>', [/\b(agile|evolutionary)\b.*\b(unknown|uncertain|unstable|chang\w*|not known|unclear|discover\w*|not stable|evolv\w*)\b/, /\b(unknown|uncertain|unstable|chang\w*|unclear|not stable)\b.*\b(agile|evolutionary)\b/], 'When requirements are not known, build small and learn from use.', 'When would agile be the right bet?'),

Q({ id: 'q401', type: 'mcq', obj: 'O4', diff: 1,

Q({ id: 'q403', type: 'written', obj: 'O4', diff: 2, simpler: 'q402',

Q({ id: 'q404', type: 'written', obj: 'O4', diff: 3, exam: true, simpler: 'q402',

Q({ id: 'q507', type: 'mcq', obj: 'O5', diff: 1,
  prompt: 'Which XP practice is this: "Write the test, watch it fail, then write the code that makes it pass"?',

  ] });

Q({ id: 'q501', type: 'mcq', obj: 'O5', diff: 1,
  prompt: 'In XP\'s planning game, who decides the <b>value</b> of a story and who decides its <b>cost</b>?',
  hint: 'Neither side overrules the other on the other\'s half.',
  options: [
    MC('The developers decide both, because they know the system', false, 'Misconception: developers should decide everything. Developers alone tend to order by what is interesting or easy, not by what is worth most to the user.'),
    MC('The business or customer decides value; the developers decide cost', true, 'Correct. Value (what, in what order) is the business\'s half; cost (risk, effort) is the developers\' half.'),
    MC('The customer decides both, because they are paying', false, 'Misconception: the customer sets estimates. Estimates then become wishes and the plan stops matching reality.'),

  ] });

Q({ id: 'q506', type: 'mcq', obj: 'O5', diff: 2, simpler: 'q507',

Q({ id: 'q601', type: 'mcq', obj: 'O6', diff: 1,

Q({ id: 'q609', type: 'mcq', obj: 'O6', diff: 1,

Q({ id: 'q608', type: 'mcq', obj: 'O6', diff: 2, simpler: 'q601',

Q({ id: 'q603', type: 'numeric', obj: 'O6', diff: 2, simpler: 'q609',

Q({ id: 'q602', type: 'written', obj: 'O6', diff: 2, simpler: 'q609',
  prompt: 'Ana merges her branch on Tuesday. Ben works on his own branch for two weeks, then merges. <b>Who is likely to face the larger merge</b>, and why does it depend more on <b>time</b> than on the size of Ben\'s own change?',

  ], passAt: 1,

Q({ id: 'q604', type: 'written', obj: 'O6', diff: 2, simpler: 'q609',

Q({ id: 'q605', type: 'written', obj: 'O6', diff: 2, simpler: 'q609',

  C('O1', 'definition', 'What is a <b>process</b>, as the course uses the word?', 'A description of how something gets done, or a prescription for how to do it. Everyone follows one; engineering is <i>intentional</i> about it.');

const Router = {

/* ---------- mixed review ---------- */
function buildReview(L, n) {
  const all = Object.values(QBANK).filter(q => q.lesson === 'l1' && q.obj !== 'P0');
  const wt = q => {
    let w = 1; const st = S().q[q.id], m = Progress.mastery(q.obj);
    if (!st) w += 1; if (S().missed.includes(q.id)) w += 3; if (m.n === 0 || m.p < 0.6) w += 1.5; if (q.exam) w += 0.7; if (st && st.last === 1) w -= 0.6;
    return Math.max(0.2, w);
  };
  const keyed = all.map(q => ({ q, k: Math.pow(Math.random(), 1 / wt(q)) })).sort((a, b) => b.k - a.k);
  const chosen = [];
  L.objectives.forEach(o => { const f = keyed.find(x => x.q.obj === o.id && !chosen.includes(x)); if (f) chosen.push(f); });
  keyed.forEach(x => { if (chosen.length < n && !chosen.includes(x)) chosen.push(x); });
  let sel = chosen.slice(0, n).map(x => x.q);
  if (sel.filter(q => q.exam).length < 2) { const ex = keyed.find(x => x.q.exam && !sel.includes(x.q)); if (ex) sel[sel.length - 1] = ex.q; }
  return sel.map(q => q.id);
}

/* ---------- summary ---------- */
function buildSummary() {
  const L = LESSONS.l1, pr = Progress.lessonProgress(L), k = Cards.counts(L), L2 = [];
  L2.push(`SE 101 study progress, generated ${stamp()}.`);
  L2.push('Goal: at least 80% on Quiz 2 (cumulative), Thursday 26 November 2026. Course materials and the study site are in the repository professeurdEnergie/se101-study-website (the site is the single file index.html).');
  L2.push(`\nLESSON 1: ${L.title} (modules ${L.modules}). ${pr.done} of ${pr.total} steps done.`);
  L2.push('\nObjective mastery (accuracy over recent attempts; flashcards known):');
  const weak = [], strong = [];
  L.objectives.forEach(o => { const m = Progress.mastery(o.id), c = Progress.cardKnown(o.id, L); L2.push(`- ${o.id} ${strip(o.text)} => ${m.label}${m.n ? ` (${pct(m.p)}, ${plural(m.n, 'attempt')})` : ''}; cards ${c.known}/${c.total}`); (m.label === 'Mastered' ? strong : weak).push(o); });
  L2.push('\nMastered: ' + (strong.length ? strong.map(o => o.id).join(', ') : 'none yet'));
  L2.push('Review first: ' + (weak.length ? weak.map(o => `${o.id} (${strip(o.text).split(',')[0].slice(0, 70)})`).join('; ') : 'nothing outstanding'));
  const wc = Cards.weakest(L, 6);
  L2.push(`\nFlashcards: ${k.known} known, ${k.learning} learning, ${k.new} not seen, of ${k.total}.` + (wc.length ? ' Weakest: ' + wc.map(c => cut(strip(c.q), 70)).join(' | ') : ''));
  const ms = Progress.missedQs();
  L2.push(ms.length ? '\nQuestions still missed: ' + ms.map(q => `${q.id} (${cut(strip(q.prompt), 80)})`).join(' | ') : '\nNo questions are currently marked as missed.');
  const pk = Object.values(S().pred); if (pk.length) L2.push(`Predictions made: ${pk.length}; matched: ${pk.filter(p => p.ok).length}.`);
  const g = S().games; L2.push('Games played: ' + (['match', 'sort', 'order', 'speed'].map(x => `${x} ${(g[x] || {}).plays || 0}`).join(', ')) + '.');
  L2.push(`\nNEXT: please build Lesson ${L.next.n}: ${L.next.title} (course module 02), unless I say otherwise. I have about 45 minutes per session, a laptop, and I learn best from flashcards, memorization games, clear diagrams and typed-answer quizzes.`);
  L2.push('Keep the same site and format: open index.html in the repository, reuse its engine (lesson registry, glossary, flashcards with again/hard/easy, games, rubric-checked typed answers with model answer and self-marking, adaptive questions, predict-then-reveal, fading worked examples, mixed review, copyable summary), add the new lesson, update the course map and glossary, keep the localStorage key and my saved progress, and base everything on the PDFs in the repository, following the course\'s own notation and pointing out where it differs from common usage.');
  return L2.join('\n');
}
Router.add(/^l1\/summary$/, el => {
  const L = LESSONS.l1; Progress.step('summary');
  const text = buildSummary();
  const rows = L.objectives.map(o => { const m = Progress.mastery(o.id); return `<tr><td>${o.id}</td><td>${o.text}</td><td><span class="chip ${m.cls}">${m.label}</span></td><td>${m.n ? pct(m.p) : '-'}</td></tr>`; }).join('');
  el.innerHTML = `<p class="crumbs"><a href="#/">Home</a> › <a href="#/l1">Lesson 1</a> › Summary</p><h1>Summary and next steps</h1>
  <table class="t"><tr><th></th><th>Objective</th><th>Status</th><th>Accuracy</th></tr>${rows}</table>
  <h3>Text to paste into a new chat</h3><p class="muted small">It lists what you have mastered, what to review, and how to continue with the next lesson.</p>
  <div class="row" style="margin-bottom:8px"><button class="btn primary" id="copy">Copy to clipboard</button><button class="btn" id="redo">Refresh text</button><span id="cps" class="small muted" aria-live="polite"></span></div>
  <div class="summary" id="sumtext" tabindex="0">${esc(text)}</div>
  <div class="row" style="margin-top:14px"><a class="btn" href="#/l1/missed">Retry missed questions</a><a class="btn" href="#/l1/cards">More flashcards</a><a class="btn" href="#/l1/review">Another mixed review</a></div>`;
  el.onclick = async e => {
    if (e.target.closest('#redo')) { $('#sumtext', el).textContent = buildSummary(); return; }
    if (e.target.closest('#copy')) {
      const t = $('#sumtext', el).textContent; let ok = false;
      try { await navigator.clipboard.writeText(t); ok = true; } catch (x) {
        const r = document.createRange(); r.selectNodeContents($('#sumtext', el)); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        try { ok = document.execCommand('copy'); } catch (y) { ok = false; }
      }
      $('#cps', el).textContent = ok ? 'Copied.' : 'Select the text and copy it manually (Ctrl+C).';
    }
  };
});

/* ---------- glossary ---------- */
Router.add(/^glossary(?:\/([a-z0-9-]+))?$/, (el, m) => {
  const ids = Object.keys(GLOSS).sort((a, b) => GLOSS[a].term.toLowerCase().localeCompare(GLOSS[b].term.toLowerCase()));
  const L = LESSONS.l1;
  const where = id => { const f = GLOSS[id].first; if (!f) return ''; const [ls, cid, sid] = f.split('/'); const ch = L.chunks.find(c => c.id === cid), sec = ch && ch.sections.find(s => s.id === sid); return sec ? `<a class="small" href="#/l1/learn/${cid}/${sid}">First introduced: Lesson 1, chunk ${L.chunks.indexOf(ch) + 1}, "${esc(sec.title)}"</a>` : ''; };
  el.innerHTML = `<h1>Glossary</h1><p class="muted">${ids.length} terms introduced so far. Terms are linked from where they first appear in the lessons.</p>
  <div class="field"><label class="l" for="gq">Filter <kbd>/</kbd></label><input type="text" id="gq" placeholder="Type part of a term or definition" autocomplete="off"></div>
  <dl class="gtable" id="gl">${ids.map(id => `<div class="gi" data-t="${esc((GLOSS[id].term + ' ' + strip(GLOSS[id].def)).toLowerCase())}"><dt id="g-${id}">${esc(GLOSS[id].term)}</dt><dd>${GLOSS[id].def}<br>${where(id)}</dd></div>`).join('')}</dl>`;
  const q = $('#gq', el);
  q.oninput = () => { const v = q.value.trim().toLowerCase(); $$('.gi', el).forEach(d => d.classList.toggle('hide', v && !d.dataset.t.includes(v))); };
  if (m[1] && GLOSS[m[1]]) { const t = $('#g-' + m[1], el); setTimeout(() => { t.scrollIntoView({ block: 'center' }); t.classList.add('flash'); }, 30); }
  App.onKey = (e, typing) => { if (!typing && e.key === '/') { e.preventDefault(); q.focus(); } };
});

/* ==== 80-boot.js ==== */
/* ---------- boot ---------- */
async function doReset() {
  const ok = await Modal.confirm({ title: 'Reset all progress?', body: '<p>This clears your flashcard ratings, question history, mastery, game records and saved predictions in this browser. It cannot be undone.</p>', ok: 'Reset everything', cancel: 'Keep my progress', danger: true });
  if (!ok) return;
  Store.reset(); location.hash = '#/'; Router.render(); toast('All progress has been reset.');
}
document.addEventListener('click', e => {
  const r = e.target.closest('[data-reset]'); if (r) { e.preventDefault(); doReset(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Modal.isOpen()) { if (Modal.onEsc) { const f = Modal.onEsc; Modal.onEsc = null; f(); } else Modal.close(); return; }
  if (Modal.isOpen()) return;
  const t = e.target, typing = !!t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if (e.key === '?' && !typing) { e.preventDefault(); showHelp(); return; }
  if (e.key === 'Escape' && typing) { t.blur(); return; }
  if (App.onKey) App.onKey(e, typing);
});
$('#btn-help').addEventListener('click', showHelp);
window.addEventListener('hashchange', () => Router.render());
Store.load();
startIcons();
if (!LESSONS.l1) throw new Error('Lesson 1 failed to register');
App.refreshChrome();
Router.render();
renderMath(document);

</script>
